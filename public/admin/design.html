<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://qrtfgqscpaghtxnhtoyp.supabase.co" crossorigin />
  <title>Design — Admin · Ducks Unlimited</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- The theme form shows each font choice written in that font, so the
       admin page loads all of them once (regular weight only — it's small).
       Cormorant Garamond and DM Sans already come with style.css. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=EB+Garamond&family=Libre+Baskerville&family=Lora&family=DM+Serif+Display&family=Inter&family=Lato&family=Work+Sans&family=Nunito+Sans&family=Karla&display=swap" />

  <style>
    /* =========================================================================
       Admin Design page — a Shopify-style editor for the storefront homepage.

       Layout below the shared admin nav:
         Top bar: undo/redo, phone/desktop preview, save status, Publish.
         Left   (260px): Theme + the list of sections.
         Middle (rest):  the real homepage in an <iframe>, updated live.
         Right  (340px): the settings form for the selected section,
                         generated from /js/section-schemas.js.
       ======================================================================= */

    body { background: var(--color-bg-warm); }

    /* ── The editor fills the screen below the admin nav ──
       Top bar across the top, then three columns:
         Sections (260px) | Preview (the rest) | Settings (340px)
       Each column scrolls on its own; the top bar never scrolls away. */
    .editor {
      height: calc(100vh - var(--admin-nav-h, 56px));
      height: calc(100dvh - var(--admin-nav-h, 56px));
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 480px;
    }
    .editor-grid {
      display: grid;
      grid-template-columns: 260px 1fr 340px;
      min-height: 0;               /* lets the columns scroll inside the grid */
    }
    .panel {
      min-height: 0;
      overflow-y: auto;
      background: #fff;
    }
    .panel--sections { border-right: 1px solid var(--color-border-light); }
    .panel--settings { border-left: 1px solid var(--color-border-light); }

    /* ── Smaller laptops (900–1099px): settings slide in over the preview ──
       The settings column becomes a "drawer" on the right, open while a
       section (or Theme) is being edited; ✕ closes it. */
    .drawer-close { display: none; }
    @media (min-width: 900px) and (max-width: 1099px) {
      .editor-grid { grid-template-columns: 240px 1fr; }
      .panel--settings {
        position: absolute; top: 0; right: 0; bottom: 0; width: 340px; z-index: 20;
        box-shadow: -8px 0 24px rgba(0,0,0,.12);
        transform: translateX(100%); transition: transform .2s ease;
      }
      .editor.is-drawer-open .panel--settings { transform: none; }
      .drawer-close { display: block; float: right; }
      .versions { width: 320px; }
    }

    /* ── Phones (< 900px): one panel at a time, chosen with tabs ──
       Sections · Settings · Preview. No dragging (use ↑ ↓ in each row). */
    .mobile-tabs { display: none; }
    .row-move { display: none; }
    @media (max-width: 899px) {
      .editor { height: calc(100dvh - var(--admin-nav-h, 56px)); grid-template-rows: auto auto 1fr; }
      .design-top { padding: .5rem .75rem; gap: .4rem; }
      .design-top h1 { font-size: 1rem; flex-basis: 100%; }
      .design-top__spacer { display: none; }
      .badge-unpublished { order: 10; }
      .mobile-tabs {
        display: grid; grid-template-columns: repeat(3, 1fr);
        border-bottom: 1px solid var(--color-border-light); background: #fff;
      }
      .mobile-tabs button {
        font-family: inherit; font-size: .85rem; padding: .7rem 0;
        background: none; border: 0; border-bottom: 2px solid transparent; color: var(--color-text-muted); cursor: pointer;
      }
      .mobile-tabs button[aria-selected="true"] { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight: 600; }
      .editor-grid { grid-template-columns: 1fr; }
      .editor-grid > .panel { display: none; }
      .editor[data-tab="sections"] .panel--sections,
      .editor[data-tab="settings"] .panel--settings,
      .editor[data-tab="preview"]  .panel--preview { display: flex; flex-direction: column; }
      .editor[data-tab="settings"] .panel--settings { display: block; }
      .editor[data-tab="sections"] .panel--sections { display: block; }
      .section-list__drag, .block__drag { display: none; }
      .row-move { display: inline-block; }
      .versions { width: 100%; }
      /* The phone preview button makes no sense on a phone — it already is one */
      [data-device] { display: none; }
    }

    /* ── Top bar ── */
    .design-top {
      background: var(--color-bg-warm);
      border-bottom: 1px solid var(--color-border-light);
      padding: .6rem 1rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      flex-wrap: wrap;
    }
    .design-top h1 {
      font-family: var(--font-heading);
      color: var(--color-primary);
      font-size: 1.2rem;
      margin: 0;
      white-space: nowrap;
    }
    .design-top__group { display: flex; gap: .2rem; }
    .design-top__spacer { flex: 1; }
    .icon-btn {
      font-family: inherit;
      font-size: .95rem;
      line-height: 1;
      padding: .45rem .6rem;
      background: #fff;
      border: 1px solid var(--color-border-light);
      color: var(--color-text);
      cursor: pointer;
    }
    .icon-btn:hover:not(:disabled) { border-color: var(--color-primary); color: var(--color-primary); }
    .icon-btn:disabled { opacity: .4; cursor: not-allowed; }
    .icon-btn.is-active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .design-top__status {
      font-size: .78rem;
      color: var(--color-text-muted);
      white-space: nowrap;
    }
    .design-top__status.is-dirty { color: var(--color-warning); }
    .design-top__status.is-saved { color: var(--color-success); }
    .design-top__status.is-error { color: var(--color-error, #a33); }
    .badge-unpublished {
      font-size: .7rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: rgba(201,168,76,.18);
      color: #6b5418;
      padding: .25rem .5rem;
      white-space: nowrap;
    }

    /* ── Middle: the live preview ── */
    .panel--preview {
      background: #e9e4da;
      overflow: hidden;
      display: flex;
    }
    .preview-stage {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 0;
      transition: padding .2s;
    }
    .preview-stage iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--color-bg-warm);
      transition: width .2s;
    }
    /* Phone view: a 390px-wide page in a subtle phone frame */
    .preview-stage.is-phone { padding: 1rem 0; }
    .preview-stage.is-phone iframe {
      width: calc(390px + 16px); /* the page inside is 390px; the frame adds 8px each side */
      border: 8px solid #1A1A1A;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }

    .btn-primary, .btn-secondary, .btn-ghost {
      font-family: inherit;
      font-size: .82rem;
      padding: .5rem 1rem;
      border: 1px solid transparent;
      cursor: pointer;
      letter-spacing: .04em;
    }
    .btn-primary   { background: var(--color-primary); color: #fff; }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .btn-secondary { background: #fff; color: var(--color-primary); border-color: var(--color-primary); }
    .btn-ghost     { background: transparent; color: var(--color-text-muted); border-color: transparent; }
    .btn-ghost:hover { color: var(--color-primary); }

    /* ── Left column: section list ── */
    .section-list { padding: 0; }
    /* "Theme" entry at the top of the list */
    .section-list__theme {
      display: flex; align-items: center; gap: .5rem;
      width: 100%;
      padding: .7rem .9rem;
      background: none; border: 0;
      border-bottom: 1px solid var(--color-border-light);
      font-family: inherit; font-size: .9rem; color: var(--color-text);
      text-align: left; cursor: pointer;
    }
    .section-list__theme:hover { background: var(--color-bg-warm); }
    .section-list__theme.is-active { background: rgba(27,77,46,0.07); box-shadow: inset 3px 0 0 var(--color-primary); }
    .section-list__head {
      padding: .75rem 1rem;
      border-bottom: 1px solid var(--color-border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-list__head h2 {
      font-family: var(--font-heading);
      font-size: 1rem;
      color: var(--color-primary);
      margin: 0;
    }
    .section-list ul { list-style: none; margin: 0; padding: 0; }
    .section-list li {
      display: flex;
      align-items: center;
      padding: .6rem .75rem;
      border-bottom: 1px solid var(--color-border-light);
      cursor: pointer;
      gap: .4rem;
    }
    .section-list li:hover    { background: var(--color-bg-warm); }
    .section-list li.is-active { background: rgba(27,77,46,0.07); border-left: 3px solid var(--color-primary); padding-left: calc(.75rem - 3px); }
    .section-list__name {
      flex: 1;
      font-size: .9rem;
      color: var(--color-text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* The small line under each section name shows that section's own
       headline, in normal lettering so it's easy to read. */
    .section-list__name small {
      display: block;
      font-size: .75rem;
      color: var(--color-text-muted);
      margin-top: .15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .section-list__icon-btn {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: .25rem .35rem;
      font-size: .85rem;
      line-height: 1;
    }
    .section-list__icon-btn:hover { color: var(--color-primary); }

    /* Drag handle + drag/drop visual feedback */
    .section-list__drag {
      color: var(--color-text-muted);
      cursor: grab;
      padding: 0 .2rem;
      font-size: .9rem;
      user-select: none;
      letter-spacing: -0.1em;
    }
    .section-list li[draggable="true"]:active .section-list__drag { cursor: grabbing; }
    .section-list li.is-dragging    { opacity: .4; }
    .section-list li.is-drop-target { border-top: 2px solid var(--color-primary); }

    .section-list__add {
      padding: .75rem 1rem;
      border-top: 1px solid var(--color-border-light);
      background: var(--color-bg);
    }
    .section-list__add select {
      width: 100%;
      padding: .45rem;
      font-size: .85rem;
      font-family: inherit;
      border: 1px solid var(--color-border-light);
      background: #fff;
    }


    /* ── Section rows: drag handle, name, eye, ⋯ menu ── */
    .section-list li.is-hidden .section-list__name { opacity: .45; }
    .tag-hidden {
      font-size: .62rem; letter-spacing: .08em; text-transform: uppercase;
      background: var(--color-bg); color: var(--color-text-muted);
      padding: .1rem .35rem; margin-left: .3rem; vertical-align: middle;
    }
    .section-list li.sortable-ghost { opacity: .35; }
    .row-menu { position: relative; }
    .row-menu > summary {
      list-style: none; cursor: pointer;
      padding: .25rem .4rem; color: var(--color-text-muted); font-size: 1rem; line-height: 1;
    }
    .row-menu > summary::-webkit-details-marker { display: none; }
    .row-menu > summary:hover { color: var(--color-primary); }
    .row-menu__items {
      position: absolute; right: 0; top: 100%; z-index: 30;
      background: #fff; border: 1px solid var(--color-border-light);
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
      min-width: 140px; display: flex; flex-direction: column;
    }
    .row-menu__items button {
      background: none; border: 0; text-align: left; cursor: pointer;
      font-family: inherit; font-size: .85rem; padding: .55rem .8rem; color: var(--color-text);
    }
    .row-menu__items button:hover { background: var(--color-bg-warm); }
    .row-menu__items button:disabled { opacity: .4; cursor: not-allowed; }
    .row-menu__items button[data-row-action="remove"] { color: #a33; }

    .section-list__add-btn {
      display: block; width: calc(100% - 1.5rem); margin: .75rem;
      padding: .6rem; font-family: inherit; font-size: .85rem;
      background: #fff; color: var(--color-primary);
      border: 1px dashed var(--color-primary); cursor: pointer;
    }
    .section-list__add-btn:hover { background: rgba(27,77,46,.05); }

    /* ── "Add section" picker ── */
    .picker {
      margin: auto;  /* centre it (the site's CSS reset removes the default) */
      border: 0; padding: 0; width: min(860px, 92vw); max-height: 85vh;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .picker::backdrop { background: rgba(0,0,0,.35); }
    .picker__head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--color-border-light);
      position: sticky; top: 0; background: #fff;
    }
    .picker__head h2 { font-family: var(--font-heading); color: var(--color-primary); margin: 0; font-size: 1.3rem; }
    .picker__grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem; padding: 1.25rem;
    }
    .picker__card {
      text-align: left; background: #fff; border: 1px solid var(--color-border-light);
      padding: 0; cursor: pointer; font-family: inherit;
    }
    .picker__card:hover, .picker__card:focus-visible { border-color: var(--color-primary); outline: none; box-shadow: 0 0 0 2px rgba(27,77,46,.15); }
    .picker__card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--color-bg); }
    .picker__card strong { display: block; padding: .6rem .75rem .2rem; color: var(--color-primary); font-size: .9rem; }
    .picker__card span { display: block; padding: 0 .75rem .75rem; font-size: .78rem; color: var(--color-text-muted); line-height: 1.4; }

    /* ── Toast ("Section removed. Undo") ── */
    .toast {
      position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%);
      background: #1A1A1A; color: #fff; padding: .7rem 1rem; z-index: 200;
      display: flex; gap: 1rem; align-items: center; font-size: .88rem;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    .toast[hidden] { display: none; }  /* "display: flex" above would beat the hidden attribute */
    .toast button { background: none; border: 0; color: var(--color-accent); font-weight: 700; cursor: pointer; font-family: inherit; font-size: .88rem; }


    /* ── Rich-text box (toolbar + text area) — see /admin/js/editor/richtext.js ── */
    .rt { border: 1px solid var(--color-border-light); background: #fff; position: relative; }
    .rt:focus-within { border-color: var(--color-primary); }
    .rt__toolbar { display: flex; gap: .15rem; padding: .25rem; border-bottom: 1px solid var(--color-border-light); background: var(--color-bg); }
    .rt__toolbar button {
      min-width: 30px; height: 28px; padding: 0 .4rem;
      background: #fff; border: 1px solid transparent; cursor: pointer;
      font-family: inherit; font-size: .85rem; color: var(--color-text);
    }
    .rt__toolbar button:hover { border-color: var(--color-border-light); color: var(--color-primary); }
    .rt__box { min-height: 90px; padding: .5rem .6rem; font-size: .9rem; line-height: 1.5; outline: none; }
    .rt__box--single { min-height: 54px; }
    .rt__box:empty::before { content: attr(data-placeholder); color: var(--color-text-muted); }
    .rt__box p { margin: 0 0 .6em; }
    .rt__box a { color: var(--color-primary); text-decoration: underline; }
    .rt__link {
      border-top: 1px solid var(--color-border-light); padding: .6rem; background: var(--color-bg-warm);
    }
    .rt__link label { font-size: .75rem; color: var(--color-text-muted); display: block; }
    .rt__link input { width: 100%; margin-top: .25rem; padding: .4rem .5rem; font-family: inherit; font-size: .85rem; border: 1px solid var(--color-border-light); }
    .rt__picks { display: flex; flex-wrap: wrap; gap: .3rem; margin: .5rem 0; }
    .rt__picks button {
      font-family: inherit; font-size: .75rem; padding: .25rem .55rem; cursor: pointer;
      background: #fff; border: 1px solid var(--color-border-light); color: var(--color-primary);
    }
    .rt__picks button:hover { border-color: var(--color-primary); }
    .rt__link-actions { display: flex; gap: .3rem; }
    .rt__link-error { font-size: .75rem; color: #a33; margin: 0 0 .5rem; }
    .rt__link-error[hidden] { display: none; }


    /* ── Theme form ── */
    .form-group-title--first { margin-top: .5rem; padding-top: 0; border-top: 0; }
    .field__hint { display: block; font-size: .72rem; color: var(--color-text-muted); margin-top: .25rem; }
    .colour-row { display: flex; align-items: center; gap: .6rem; }
    .colour-row__hex { font-size: .8rem; color: var(--color-text-muted); font-variant-numeric: tabular-nums; min-width: 4.5em; }
    .colour-row__reset { font-size: .75rem; padding: .3rem .4rem; margin-left: auto; }
    .colour-row__reset:disabled { opacity: .35; cursor: default; }
    .font-choices, .shape-choices { border: 0; padding: 0; margin: 0 0 1rem; }
    .font-choices legend, .shape-choices legend { font-size: .78rem; color: var(--color-text-muted); letter-spacing: .05em; margin-bottom: .35rem; }
    .font-choice {
      display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: .6rem;
      padding: .45rem .6rem; border: 1px solid var(--color-border-light); margin-bottom: -1px; cursor: pointer;
    }
    .font-choice:has(input:checked) { border-color: var(--color-primary); background: rgba(27,77,46,.05); position: relative; }
    .font-choice input { grid-row: span 2; accent-color: var(--color-primary); }
    .font-choice__sample { font-size: 1.15rem; line-height: 1.2; color: var(--color-text); }
    .font-choice__name { font-size: .7rem; color: var(--color-text-muted); }
    .shape-choices { display: flex; gap: .5rem; }
    .shape-choices legend { width: 100%; }
    .shape-choice {
      position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: .4rem;
      padding: .6rem .3rem; border: 1px solid var(--color-border-light); cursor: pointer; font-size: .78rem;
    }
    .shape-choice:has(input:checked) { border-color: var(--color-primary); background: rgba(27,77,46,.05); }
    .shape-choice input { position: absolute; opacity: 0; pointer-events: none; }
    .shape-choice:has(input:focus-visible) { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .shape-choice__sample {
      background: var(--color-primary); color: #fff; font-size: .65rem; letter-spacing: .08em;
      text-transform: uppercase; padding: .4rem .7rem;
    }
    .shape-choice__sample--square  { border-radius: 0; }
    .shape-choice__sample--rounded { border-radius: 6px; }
    .shape-choice__sample--pill    { border-radius: 999px; }


    /* ── History panel + "Previewing a saved version" note ── */
    .editor-grid { position: relative; }
    .versions {
      position: absolute; top: 0; right: 0; bottom: 0; width: 340px; z-index: 25;
      background: #fff; border-left: 1px solid var(--color-border-light);
      box-shadow: -8px 0 24px rgba(0,0,0,.08); overflow-y: auto; padding: 1rem 1.25rem;
    }
    .versions[hidden] { display: none; }
    .versions__head { display: flex; justify-content: space-between; align-items: center; }
    .versions__head h2 { font-family: var(--font-heading); color: var(--color-primary); margin: 0; font-size: 1.3rem; }
    .versions__intro { font-size: .8rem; color: var(--color-text-muted); margin: .4rem 0 1rem; }
    .versions__list { list-style: none; margin: 0; padding: 0; }
    .versions__item { border: 1px solid var(--color-border-light); padding: .7rem .8rem; margin-bottom: .5rem; }
    .versions__item.is-previewing { border-color: var(--color-accent); background: rgba(201,168,76,.08); }
    .versions__when { font-size: .88rem; color: var(--color-text); font-weight: 500; }
    .versions__live {
      font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; margin-left: .35rem;
      background: rgba(27,77,46,.1); color: var(--color-primary); padding: .1rem .35rem; vertical-align: middle;
    }
    .versions__who { font-size: .75rem; color: var(--color-text-muted); margin: .15rem 0 .5rem; word-break: break-all; }
    .versions__actions { display: flex; gap: .4rem; }
    .versions__actions button { font-size: .75rem; padding: .35rem .7rem; }
    .versions__empty { font-size: .85rem; color: var(--color-text-muted); font-style: italic; }
    .panel--preview { flex-direction: column; }
    .preview-note {
      background: var(--color-accent); color: #1A1A1A; font-size: .82rem; text-align: center; padding: .45rem;
    }
    .preview-note[hidden] { display: none; }
    .preview-note button { background: none; border: 0; text-decoration: underline; font: inherit; font-weight: 700; cursor: pointer; }


    /* Photo fields: "…or paste a photo's web address" under the upload box */
    .field__paste-url { margin-top: .4rem; }
    .field__paste-url summary { font-size: .75rem; color: var(--color-text-muted); cursor: pointer; }
    .field__paste-url input { margin-top: .35rem; }
    .block__drag { cursor: grab; color: var(--color-text-muted); margin-right: .2rem; }

    .field__error { display: block; font-size: .75rem; color: #a33; margin-top: .3rem; }
    .field__error[hidden] { display: none; }

    /* ── Right column: section form ── */
    .section-form { padding: 1.25rem; }
    .form-group-title {
      font-family: var(--font-heading);
      font-size: 1rem;
      color: var(--color-primary);
      margin: 1.5rem 0 .75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--color-border-light);
    }
    .section-form__empty {
      color: var(--color-text-muted);
      padding: 3rem 1rem;
      text-align: center;
      font-style: italic;
    }
    .section-form h2 {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      color: var(--color-primary);
      margin: 0 0 .25rem;
    }
    .section-form__desc {
      font-size: .85rem;
      color: var(--color-text-muted);
      margin-bottom: 1.25rem;
    }
    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: .78rem;
      color: var(--color-text-muted);
      letter-spacing: .05em;
      margin-bottom: .3rem;
    }
    .field input[type=text],
    .field input[type=url],
    .field input[type=number],
    .field textarea,
    .field select {
      width: 100%;
      padding: .5rem .6rem;
      font-family: inherit;
      font-size: .9rem;
      border: 1px solid var(--color-border-light);
      background: #fff;
    }
    .field textarea { min-height: 90px; resize: vertical; }
    .field input[type=color] { height: 38px; width: 70px; border: 1px solid var(--color-border-light); padding: 2px; }
    .field input[type=range] { width: 100%; }
    .field__range-value { font-size: .78rem; color: var(--color-text-muted); margin-left: .5rem; }
    .field__image-preview {
      margin-top: .4rem;
      max-width: 160px;
      max-height: 100px;
      background: var(--color-bg);
      border: 1px solid var(--color-border-light);
      object-fit: cover;
    }

    /* Blocks UI (nested inside sections like category-tiles) */
    .blocks {
      border: 1px dashed var(--color-border-light);
      padding: .75rem;
      margin-top: 1rem;
    }
    .blocks__head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: .5rem;
    }
    .blocks__head h3 {
      font-family: var(--font-heading);
      font-size: 1rem;
      color: var(--color-primary);
      margin: 0;
    }
    .block {
      background: var(--color-bg-warm);
      padding: .75rem;
      margin-bottom: .5rem;
      border-left: 3px solid var(--color-accent);
    }
    .block__head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: .5rem;
    }
    .block__title { font-size: .82rem; font-weight: 600; color: var(--color-primary); }
    .block__controls button {
      background: none; border: none; cursor: pointer; color: var(--color-text-muted);
      font-size: .85rem; padding: 0 .25rem;
    }
    .block__controls button:hover { color: var(--color-primary); }
  </style>
  <!-- Browser-tab icon: the Ducks Unlimited duck badge -->
  <link rel="icon" type="image/png" href="/images/brand/du-favicon.png" />
  <link rel="apple-touch-icon" href="/images/brand/du-apple-touch-icon.png" />
  <!-- "Add to Home Screen": app name, icon list (Android) and the green phone status bar -->
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="DU Admin" />
  <meta name="theme-color" content="#1B4D2E" />
</head>

<body>

  <!-- Shared admin nav mounted by /js/components.js -->
  <div data-component="admin-nav"></div>

  <div class="editor" data-tab="sections">

    <!-- TOP BAR: what you're editing, undo/redo, phone/desktop, save status, Publish -->
    <div class="design-top">
      <h1 data-editor-title>Homepage</h1>
      <div class="design-top__group">
        <button type="button" class="icon-btn" data-undo disabled title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
        <button type="button" class="icon-btn" data-redo disabled title="Redo (Shift+Ctrl+Z)" aria-label="Redo">↷</button>
      </div>
      <div class="design-top__group" role="group" aria-label="Preview size">
        <button type="button" class="icon-btn" data-device="phone"   title="Phone view"   aria-label="Phone view"   aria-pressed="false">📱</button>
        <button type="button" class="icon-btn is-active" data-device="desktop" title="Desktop view" aria-label="Desktop view" aria-pressed="true">🖥</button>
      </div>
      <div class="design-top__spacer"></div>
      <span class="badge-unpublished" data-unpublished hidden>Unpublished changes</span>
      <span class="design-top__status" data-status aria-live="polite"></span>
      <button class="btn-secondary" data-history-btn type="button">History</button>
      <button class="btn-primary"   data-publish-btn    type="button">Publish</button>
    </div>

    <!-- Phones only: one panel at a time -->
    <div class="mobile-tabs" role="tablist" aria-label="Editor panels">
      <button type="button" role="tab" data-tab-btn="sections" aria-selected="true">Sections</button>
      <button type="button" role="tab" data-tab-btn="settings" aria-selected="false">Settings</button>
      <button type="button" role="tab" data-tab-btn="preview"  aria-selected="false">Preview</button>
    </div>

    <div class="editor-grid">

      <!-- LEFT: Theme + the list of sections -->
      <aside class="panel panel--sections section-list">
        <button type="button" class="section-list__theme" data-theme-btn>🎨 Theme <small style="color:var(--color-text-muted)">colours &amp; fonts</small></button>
        <ul data-section-list></ul>
        <button type="button" class="section-list__add-btn" data-add-section>+ Add section</button>
      </aside>

      <!-- MIDDLE: the real homepage, showing your changes as you type -->
      <section class="panel panel--preview" aria-label="Preview">
        <div class="preview-note" data-preview-note hidden>
          Previewing a saved version · <button type="button" data-preview-back>Back to your draft</button>
        </div>
        <div class="preview-stage" data-preview-stage>
          <iframe data-preview-frame title="Homepage preview"></iframe>
        </div>
      </section>

      <!-- History panel (opens over the settings column) -->
      <aside class="versions" data-versions-panel hidden aria-label="Version history"></aside>

      <!-- RIGHT: settings for the selected section (filled by JS) -->
      <section class="panel panel--settings section-form" data-section-form>
        <div class="section-form__empty">Click a section in the list or in the preview to edit it.</div>
      </section>

    </div>
  </div>

  <!-- "Add section" picker (filled by JS) -->
  <dialog class="picker" data-picker aria-labelledby="picker-title">
    <div class="picker__head">
      <h2 id="picker-title">Add a section</h2>
      <button type="button" class="icon-btn" data-picker-close aria-label="Close">✕</button>
    </div>
    <div class="picker__grid" data-picker-grid></div>
  </dialog>

  <!-- Messages like "Section removed. Undo" appear here -->
  <div class="toast" data-toast hidden role="status"></div>

  <!-- SortableJS: drag-and-drop reordering of the section list.
       Pinned to one exact version; "integrity" makes the browser refuse the
       file if cdnjs ever served something different. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"
          integrity="sha512-csIng5zcB+XpulRUa+ev1zKo7zRNGpEaVfNB9On1no9KYTEY/rLGAEEpvgdw6nim1WdTuihZY1eqZ31K7/fZjw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="/js/components.js"></script>
  <script type="module" src="/admin/js/design.js"></script>
</body>
</html>
