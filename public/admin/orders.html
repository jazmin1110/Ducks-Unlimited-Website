<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://qrtfgqscpaghtxnhtoyp.supabase.co" crossorigin />
  <title>Orders — Ducks Unlimited Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #F5F0E8;
      color: #1A1A1A;
      min-height: 100vh;
    }

    /* Nav styles live in /components/admin-nav.html (shared across admin) */

    /* ── Page layout ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .page-header { margin-bottom: 1.5rem; }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.75rem;
      font-weight: 600;
      color: #1B4D2E;
    }

    .page-subtitle {
      font-size: 0.9rem;
      color: #777;
      margin-top: 0.25rem;
    }

    /* ── Filters bar ── */
    .filters-bar {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      padding: 1rem;
      margin-bottom: 1rem;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr;
      gap: 0.75rem;
      align-items: end;
    }

    @media (max-width: 900px) {
      .filters-bar { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 540px) {
      .filters-bar { grid-template-columns: 1fr; }
    }

    .filter-field label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 0.35rem;
    }

    .filter-field input,
    .filter-field select {
      width: 100%;
      padding: 0.55rem 0.85rem;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      color: #1A1A1A;
      background: #fff;
      transition: border-color 0.15s;
    }

    .filter-field input:focus,
    .filter-field select:focus {
      outline: none;
      border-color: #1B4D2E;
    }

    /* ── Orders table ── */
    .table-wrap {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      overflow-x: auto;
    }

    table.orders-list {
      width: 100%;
      border-collapse: collapse;
      min-width: 880px;
    }

    table.orders-list thead {
      background-color: #1B4D2E;
      color: #fff;
    }

    table.orders-list th {
      text-align: left;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.85rem 1rem;
      white-space: nowrap;
    }

    table.orders-list th.col-total { text-align: right; }

    table.orders-list tbody tr {
      border-bottom: 1px solid #f0ebe1;
      transition: background-color 0.1s;
      cursor: pointer;
    }

    table.orders-list tbody tr:last-child { border-bottom: none; }
    table.orders-list tbody tr:hover      { background-color: #faf7f2; }

    table.orders-list td {
      padding: 0.9rem 1rem;
      font-size: 0.9rem;
      vertical-align: middle;
    }

    table.orders-list td.col-total {
      text-align: right;
      font-weight: 500;
    }

    .cell-order-num {
      font-family: 'SF Mono', Monaco, Menlo, monospace;
      font-weight: 500;
      color: #1B4D2E;
    }

    .cell-date-main {
      font-size: 0.9rem;
      color: #1A1A1A;
    }

    .cell-date-sub {
      font-size: 0.75rem;
      color: #999;
      margin-top: 0.1rem;
    }

    .cell-customer {
      font-weight: 500;
      color: #1A1A1A;
    }

    .cell-items {
      color: #666;
    }

    /* ── Status badges (shared between table + panel) ── */
    .status-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* Payment status colors */
    .pay-pending  { background: #fff4d6; color: #997f33; }
    .pay-paid     { background: #e6f2ec; color: #1B4D2E; }
    .pay-failed   { background: #fdf0f0; color: #b33a3a; }

    /* Fulfillment status colors */
    .ful-pending   { background: #f0ebe1; color: #777; }
    .ful-packed    { background: #e0ebf5; color: #2d5a87; }
    .ful-shipped   { background: #fff4d6; color: #997f33; }
    .ful-delivered { background: #e6f2ec; color: #1B4D2E; }
    .ful-cancelled { background: #eee; color: #555; text-decoration: line-through; }
    .refund-badge  { background: #fdf0f0; color: #b33a3a; }

    /* ── Cancel / refund section ── */
    .refund-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }

    .btn-danger-outline {
      background: none;
      border: 1px solid #b33a3a;
      color: #b33a3a;
      border-radius: 5px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
    }
    .btn-danger-outline:hover { background: #fdf0f0; }

    .btn-danger {
      background: #b33a3a;
      border: none;
      color: #fff;
      border-radius: 5px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.65rem 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 0.5rem;
    }
    .btn-danger:disabled { opacity: 0.6; cursor: wait; }

    .refund-form {
      background: #faf7f2;
      border: 1px solid #efe6d4;
      border-radius: 6px;
      padding: 0.9rem;
      margin-top: 0.75rem;
    }

    .refund-form h4 { font-size: 0.9rem; color: #1A1A1A; margin-bottom: 0.5rem; }
    .refund-form .help { font-size: 0.8rem; color: #666; margin-bottom: 0.75rem; line-height: 1.45; }
    .refund-form label.radio {
      display: flex; gap: 0.5rem; align-items: flex-start;
      font-size: 0.85rem; padding: 0.4rem 0; cursor: pointer;
    }
    .refund-form label.radio input { margin-top: 0.2rem; }

    .return-item {
      display: grid;
      grid-template-columns: 1fr 64px;
      gap: 0.4rem 0.5rem;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid #efe6d4;
      font-size: 0.82rem;
    }
    .return-item select { grid-column: 1 / -1; }
    .return-item input,
    .return-item select,
    .refund-form .field input,
    .refund-form .field select {
      width: 100%;
      padding: 0.45rem 0.55rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      background: #fff;
    }

    .refund-history { list-style: none; margin: 0.75rem 0 0; padding: 0; font-size: 0.8rem; color: #555; }
    .refund-history li { padding: 0.45rem 0; border-top: 1px dashed #e5ddcc; }
    .refund-history strong { color: #1A1A1A; }

    .cancelled-note {
      background: #f3f3f3;
      border-left: 3px solid #888;
      padding: 0.6rem 0.85rem;
      font-size: 0.85rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }

    /* Stack the two badges vertically in tight columns */
    .badge-stack {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      align-items: flex-start;
    }

    /* ── Table state messages ── */
    .table-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #aaa;
      font-size: 0.9rem;
    }

    .table-state button {
      margin-top: 0.75rem;
      background: none;
      border: 1px solid #ddd;
      color: #555;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      padding: 0.45rem 1rem;
      border-radius: 5px;
      cursor: pointer;
    }

    .table-state button:hover { border-color: #1B4D2E; color: #1B4D2E; }

    /* ── Slide-in detail panel ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .overlay.open { opacity: 1; pointer-events: all; }

    .panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      height: 100dvh; /* visible screen height on phones (excludes browser toolbars) */
      width: 100%;
      /* Wider than other panels — orders have a lot of info */
      max-width: 520px;
      background: #fff;
      z-index: 201;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
    }

    .panel.open { transform: translateX(0); }

    .panel-header {
      background-color: #1B4D2E;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      height: 56px;
      flex-shrink: 0;
    }

    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .panel-close {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.25rem;
      transition: color 0.15s;
    }

    .panel-close:hover { color: #fff; }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .panel-loading {
      padding: 3rem 1.25rem;
      text-align: center;
      color: #aaa;
      font-size: 0.9rem;
    }

    /* ── Panel sections ── */
    .order-section {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #eee;
    }

    .order-section:last-of-type { border-bottom: none; }

    .section-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 600;
      color: #1B4D2E;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.85rem;
    }

    /* ── Order summary at very top of panel ── */
    .order-summary {
      background: #faf7f2;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #eee;
    }

    .summary-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .order-number {
      font-family: 'SF Mono', Monaco, Menlo, monospace;
      font-size: 1rem;
      font-weight: 500;
      color: #1B4D2E;
    }

    .order-date {
      font-size: 0.82rem;
      color: #777;
    }

    .summary-badges {
      margin-top: 0.6rem;
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .summary-total {
      margin-top: 0.85rem;
      padding-top: 0.85rem;
      border-top: 1px solid #e8e3d8;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .summary-total-label {
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #777;
    }

    .summary-total-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: #1A1A1A;
    }

    /* ── Customer info ── */
    .info-row {
      display: flex;
      gap: 0.5rem;
      font-size: 0.88rem;
      margin-bottom: 0.4rem;
      align-items: flex-start;
    }

    .info-label {
      flex: 0 0 80px;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #999;
      padding-top: 0.1rem;
    }

    .info-value {
      flex: 1;
      color: #1A1A1A;
      line-height: 1.5;
      word-break: break-word;
    }

    .info-value a {
      color: #1B4D2E;
      text-decoration: none;
    }

    .info-value a:hover { text-decoration: underline; }

    /* ── Line items table ── */
    table.items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    table.items-table td {
      padding: 0.55rem 0;
      border-bottom: 1px solid #f5f0e8;
      vertical-align: top;
    }

    table.items-table tr:last-child td { border-bottom: none; }

    .item-name {
      font-weight: 500;
      color: #1A1A1A;
    }

    .item-variant {
      font-size: 0.78rem;
      color: #888;
      margin-top: 0.15rem;
    }

    .item-qty   { white-space: nowrap; color: #555; text-align: right; padding-right: 0.75rem !important; }
    .item-price { white-space: nowrap; color: #1A1A1A; font-weight: 500; text-align: right; }

    .items-total {
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid #ddd;
      font-weight: 500;
      font-size: 0.95rem;
    }

    /* ── Editable form section ── */
    .field {
      margin-bottom: 1rem;
    }

    .field:last-child { margin-bottom: 0; }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 0.4rem;
    }

    .field input[type="text"],
    .field select,
    .field textarea {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      color: #1A1A1A;
      background: #fff;
      transition: border-color 0.15s;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: #1B4D2E;
    }

    .field textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* ── Quick tabs above the filters ("To pack", "To ship"…) ── */
    .quick-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .quick-tab {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 0.5rem 1rem;          /* big enough to tap on a phone */
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
    }

    .quick-tab:hover { border-color: #1B4D2E; color: #1B4D2E; }

    .quick-tab.is-active {
      background: #1B4D2E;
      border-color: #1B4D2E;
      color: #fff;
    }

    .quick-tab .tab-count {
      display: inline-block;
      min-width: 1.4em;
      margin-left: 0.3rem;
      padding: 0 0.35rem;
      border-radius: 10px;
      background: rgba(0,0,0,0.08);
      font-size: 0.75rem;
      text-align: center;
    }

    .quick-tab.is-active .tab-count { background: rgba(255,255,255,0.25); }

    /* Small grey note under the filters (e.g. which brand is shown) */
    .list-note {
      font-size: 0.8rem;
      color: #888;
      margin: -0.5rem 0 0.75rem;
    }

    /* Red warning shown when an unpaid order is being packed / shipped */
    .unpaid-warning {
      background: #fdf0f0;
      border-left: 3px solid #b33a3a;
      color: #8a2b2b;
      font-size: 0.82rem;
      padding: 0.55rem 0.85rem;
      border-radius: 4px;
      margin-top: 0.5rem;
    }

    /* Subtotal / shipping lines above the order total */
    .items-subline {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #666;
      padding: 0.2rem 0;
    }

    .btn-print {
      background: none;
      border: 1px solid #1B4D2E;
      color: #1B4D2E;
      border-radius: 5px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      margin-top: 0.75rem;
    }

    .btn-print:hover { background: #eef4f0; }

    /* Yellow warning shown when status is "shipped" but tracking is empty */
    .tracking-warning {
      display: none;
      background: #fff4d6;
      border-left: 3px solid #C9A84C;
      color: #6b561f;
      font-size: 0.82rem;
      padding: 0.55rem 0.85rem;
      border-radius: 4px;
      margin-top: 0.5rem;
    }

    .tracking-warning.visible { display: block; }

    /* PayMongo ID has monospace font + smaller size */
    .paymongo-id {
      font-family: 'SF Mono', Monaco, Menlo, monospace;
      font-size: 0.82rem;
      color: #555;
      word-break: break-all;
    }

    .paymongo-id-empty {
      font-style: italic;
      color: #aaa;
    }

    /* ── Panel footer ── */
    .panel-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid #eee;
      display: flex;
      gap: 0.75rem;
      flex-shrink: 0;
      background: #fff;
    }

    .btn-save {
      flex: 1;
      padding: 0.7rem;
      background-color: #1B4D2E;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s, opacity 0.15s;
    }

    .btn-save:hover { background-color: #163d24; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-cancel {
      padding: 0.7rem 1.25rem;
      background: none;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      color: #555;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .btn-cancel:hover { border-color: #999; }

    /* Inline error inside panel */
    .panel-error {
      display: none;
      background: #fdf0f0;
      border: 1px solid #e8c0c0;
      color: #b33a3a;
      border-radius: 5px;
      padding: 0.6rem 0.9rem;
      font-size: 0.85rem;
      margin: 1.25rem 1.5rem 0;
    }

    .panel-error.visible { display: block; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #1B4D2E;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      font-size: 0.875rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      z-index: 300;
      transform: translateY(8px);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
  <!-- Browser-tab icon: the Ducks Unlimited duck badge -->
  <link rel="icon" type="image/png" href="/images/brand/du-favicon.png" />
  <link rel="apple-touch-icon" href="/images/brand/du-apple-touch-icon.png" />
  <!-- "Add to Home Screen": app name, icon list (Android) and the green phone status bar -->
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="DU Admin" />
  <meta name="theme-color" content="#1B4D2E" />
</head>
<body>

  <!-- Shared admin nav — see /components/admin-nav.html -->
  <div data-component="admin-nav"></div>

  <main>

    <div class="page-header">
      <h1 class="page-title">Orders</h1>
      <p class="page-subtitle">All online orders. Tap an order to see what to pack, print a packing slip, and update its status.</p>
    </div>

    <!-- ── Quick tabs: one tap shows the orders that need work ── -->
    <div class="quick-tabs" id="quickTabs">
      <button type="button" class="quick-tab is-active" data-show="">All orders</button>
      <button type="button" class="quick-tab" data-show="to-pack">To pack <span class="tab-count" data-count="to-pack"></span></button>
      <button type="button" class="quick-tab" data-show="to-ship">To ship <span class="tab-count" data-count="to-ship"></span></button>
      <button type="button" class="quick-tab" data-show="unpaid">Not paid yet <span class="tab-count" data-count="unpaid"></span></button>
      <button type="button" class="quick-tab" data-show="done">Delivered</button>
    </div>

    <!-- ── Filters bar ── -->
    <div class="filters-bar">

      <div class="filter-field">
        <label for="filterSearch">Search</label>
        <input
          type="search"
          id="filterSearch"
          placeholder="Order #, name, email or phone…"
          autocomplete="off"
        />
      </div>

      <div class="filter-field">
        <label for="filterPayment">Payment</label>
        <select id="filterPayment">
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="failed">Failed</option>
        </select>
      </div>

      <div class="filter-field">
        <label for="filterFulfillment">Fulfillment</label>
        <select id="filterFulfillment">
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="packed">Packed</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div class="filter-field">
        <label for="filterFromDate">From</label>
        <input type="date" id="filterFromDate" />
      </div>

      <div class="filter-field">
        <label for="filterToDate">To</label>
        <input type="date" id="filterToDate" />
      </div>

    </div>

    <p class="list-note" id="brandNote"></p>

    <!-- ── Orders table ── -->
    <div class="table-wrap">
      <table class="orders-list">
        <thead>
          <tr>
            <th>Order #</th>
            <th>Date</th>
            <th>Customer</th>
            <th>Items</th>
            <th class="col-total">Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody">
          <tr><td colspan="6" class="table-state">Loading orders…</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- ── Slide-in detail panel ── -->
  <div class="overlay" id="overlay"></div>

  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">

    <div class="panel-header">
      <span class="panel-title" id="panelTitle">Order Details</span>
      <button class="panel-close" id="panelCloseBtn" aria-label="Close panel">×</button>
    </div>

    <!-- Body sections rendered dynamically into here -->
    <div class="panel-body" id="panelBody">
      <div class="panel-loading">Loading…</div>
    </div>

    <div class="panel-footer">
      <button type="button" class="btn-cancel" id="panelCancelBtn">Cancel</button>
      <button type="button" class="btn-save"   id="saveBtn">Save Changes</button>
    </div>

  </div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast"></div>

  <script type="module">
    import { supabase } from '/lib/supabase.js';
    import { requireAdmin } from '/admin/js/admin-guard.js';
    import { adminBrandFilter } from '/js/brand.js';
    import { fetchAll } from '/admin/js/bulk-data.js';

    // ── Auth guard ──
    // Only signed-in admins get past this line (see /admin/js/admin-guard.js)
    const session = await requireAdmin();

    // Log out is handled by /components/admin-nav.html

    // ─────────────────────────────────────────────────────────────────────
    // CONSTANTS & ELEMENT REFERENCES
    // ─────────────────────────────────────────────────────────────────────

    // Filter inputs
    const searchInput        = document.getElementById('filterSearch');
    const paymentSelect      = document.getElementById('filterPayment');
    const fulfillmentSelect  = document.getElementById('filterFulfillment');
    const fromDateInput      = document.getElementById('filterFromDate');
    const toDateInput        = document.getElementById('filterToDate');

    // Table + panel
    const tableBody  = document.getElementById('ordersTableBody');
    const overlay    = document.getElementById('overlay');
    const panel      = document.getElementById('panel');
    const panelTitle = document.getElementById('panelTitle');
    const panelBody  = document.getElementById('panelBody');
    const saveBtn    = document.getElementById('saveBtn');
    const toast      = document.getElementById('toast');

    // Display labels for status codes
    const PAYMENT_LABELS = {
      pending: 'Pending',
      paid:    'Paid',
      failed:  'Failed',
    };

    const FULFILLMENT_LABELS = {
      pending:   'Pending',
      packed:    'Packed',
      shipped:   'Shipped',
      delivered: 'Delivered',
      cancelled: 'Cancelled',
    };

    // ─────────────────────────────────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────────────────────────────────

    // All orders fetched from the DB (used by the list view)
    let allOrders = [];

    // After filters applied
    let filteredView = [];

    // Full data of the order currently open in the detail panel
    let currentOrder = null;

    // Which quick tab is selected: '' (all), 'to-pack', 'to-ship', 'unpaid', 'done'.
    // Can be set from the URL, e.g. the dashboard links to ?show=to-pack
    let quickTab = new URLSearchParams(window.location.search).get('show') ?? '';

    // What each quick tab means, as a yes/no test on one order
    const QUICK_TABS = {
      'to-pack': o => o.paymentStatus === 'paid' && o.fulfillmentStatus === 'pending',
      'to-ship': o => o.paymentStatus === 'paid' && o.fulfillmentStatus === 'packed',
      'unpaid':  o => o.paymentStatus !== 'paid' && o.fulfillmentStatus !== 'cancelled',
      'done':    o => o.fulfillmentStatus === 'delivered',
    };

    // ─────────────────────────────────────────────────────────────────────
    // HELPERS
    // ─────────────────────────────────────────────────────────────────────

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    let toastTimer;
    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Format a price in PHP — e.g. "₱1,250.00"
    function formatPrice(amount) {
      return '₱' + Number(amount).toLocaleString('en-PH', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    // Format a date for the table — "May 11, 2026 / 2:30 PM" split across two lines
    function formatDate(iso) {
      const d = new Date(iso);
      return {
        main: d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' }),
        sub:  d.toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' }),
      };
    }

    // ─────────────────────────────────────────────────────────────────────
    // DATA LOADING (LIST VIEW)
    // ─────────────────────────────────────────────────────────────────────

    async function loadOrders() {
      tableBody.innerHTML = '<tr><td colspan="6" class="table-state">Loading orders…</td></tr>';

      // Scope to the admin's chosen brand. Each order has brand_id (migration
      // 011); the embedded brands!inner lets us filter by slug at the DB.
      const brandFilter = adminBrandFilter();

      document.getElementById('brandNote').textContent = brandFilter
        ? `Showing ${brandFilter === 'rw' ? 'Rocwood' : 'Ducks Unlimited'} orders only. Orders with both brands in one bag are filed under Ducks Unlimited. Pick "All brands" in the top bar to see everything.`
        : '';

      // fetchAll() pages through the results so nothing is cut off at 1000 orders
      let data, error;
      try {
        data = await fetchAll(() => {
          let query = supabase
            .from('orders')
            .select(`
              id, order_number, customer_name, customer_email, customer_phone, total_amount,
              payment_status, fulfillment_status, created_at, refunded_amount,
              brands!inner ( slug, name ),
              order_items ( count )
            `)
            .order('created_at', { ascending: false })
            .order('id');
          if (brandFilter) query = query.eq('brands.slug', brandFilter);
          return query;
        });
      } catch (err) {
        error = err;
      }

      if (error) {
        console.error(error);
        tableBody.innerHTML = '<tr><td colspan="6" class="table-state">Failed to load orders. Please refresh.</td></tr>';
        return;
      }

      allOrders = (data || []).map(o => ({
        id:                 o.id,
        orderNumber:        o.order_number,
        customerName:       o.customer_name,
        customerEmail:      o.customer_email ?? '',
        customerPhone:      o.customer_phone ?? '',
        totalAmount:        Number(o.total_amount),
        paymentStatus:      o.payment_status,
        fulfillmentStatus:  o.fulfillment_status,
        createdAt:          o.created_at,
        itemCount:          o.order_items?.[0]?.count ?? 0,
        refundedAmount:     Number(o.refunded_amount ?? 0),
      }));

      applyFiltersAndRender();
    }

    // ─────────────────────────────────────────────────────────────────────
    // FILTERING + LIST RENDERING
    // ─────────────────────────────────────────────────────────────────────

    function applyFiltersAndRender() {
      const q        = searchInput.value.trim().toLowerCase();
      const pay      = paymentSelect.value;
      const ful      = fulfillmentSelect.value;
      const from     = fromDateInput.value ? new Date(fromDateInput.value + 'T00:00:00') : null;
      const to       = toDateInput.value   ? new Date(toDateInput.value   + 'T23:59:59.999') : null;

      updateTabCounts();

      filteredView = allOrders.filter(o => {
        // Quick tab first ("To pack", "To ship"…)
        if (quickTab && QUICK_TABS[quickTab] && !QUICK_TABS[quickTab](o)) return false;

        // Search matches order number, customer name, email or phone (case-insensitive)
        if (q) {
          const haystack = [o.orderNumber, o.customerName, o.customerEmail, o.customerPhone]
            .join(' ').toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        if (pay && o.paymentStatus     !== pay) return false;
        if (ful && o.fulfillmentStatus !== ful) return false;

        // Date range — inclusive on both ends
        if (from || to) {
          const created = new Date(o.createdAt);
          if (from && created < from) return false;
          if (to   && created > to)   return false;
        }

        return true;
      });

      renderTable();
    }

    // Show how many orders are waiting in each quick tab
    function updateTabCounts() {
      document.querySelectorAll('[data-count]').forEach(el => {
        const n = allOrders.filter(QUICK_TABS[el.dataset.count]).length;
        el.textContent = n;
      });
      document.querySelectorAll('.quick-tab').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.show === quickTab);
      });
    }

    document.getElementById('quickTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.quick-tab');
      if (!btn) return;
      quickTab = btn.dataset.show;
      applyFiltersAndRender();
    });

    function renderTable() {
      if (filteredView.length === 0) {
        const hasFilters = quickTab || searchInput.value || paymentSelect.value || fulfillmentSelect.value
                         || fromDateInput.value || toDateInput.value;

        if (allOrders.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="6" class="table-state">No orders yet. They\'ll appear here when customers place orders.</td></tr>';
        } else if (hasFilters) {
          tableBody.innerHTML = `<tr><td colspan="6" class="table-state">
              No orders match your filters.
              <br><button type="button" id="clearFiltersBtn">Clear filters</button>
            </td></tr>`;
          document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);
        } else {
          tableBody.innerHTML = '<tr><td colspan="6" class="table-state">No orders.</td></tr>';
        }
        return;
      }

      tableBody.innerHTML = '';

      for (const o of filteredView) {
        const dt = formatDate(o.createdAt);
        const tr = document.createElement('tr');
        tr.dataset.orderId = o.id;

        tr.innerHTML = `
          <td><span class="cell-order-num">${escapeHtml(o.orderNumber)}</span></td>
          <td>
            <div class="cell-date-main">${dt.main}</div>
            <div class="cell-date-sub">${dt.sub}</div>
          </td>
          <td><span class="cell-customer">${escapeHtml(o.customerName)}</span></td>
          <td><span class="cell-items">${o.itemCount} item${o.itemCount === 1 ? '' : 's'}</span></td>
          <td class="col-total">${formatPrice(o.totalAmount)}</td>
          <td>
            <div class="badge-stack">
              <span class="status-badge pay-${o.paymentStatus}">${PAYMENT_LABELS[o.paymentStatus] ?? escapeHtml(o.paymentStatus)}</span>
              <span class="status-badge ful-${o.fulfillmentStatus}">${FULFILLMENT_LABELS[o.fulfillmentStatus] ?? escapeHtml(o.fulfillmentStatus)}</span>
              ${o.refundedAmount > 0 ? `<span class="status-badge refund-badge">Refunded ${formatPrice(o.refundedAmount)}</span>` : ''}
            </div>
          </td>
        `;
        tableBody.appendChild(tr);
      }
    }

    function clearFilters() {
      quickTab = '';
      searchInput.value = '';
      paymentSelect.value = '';
      fulfillmentSelect.value = '';
      fromDateInput.value = '';
      toDateInput.value = '';
      applyFiltersAndRender();
    }

    // Live filtering
    searchInput.addEventListener('input', applyFiltersAndRender);
    paymentSelect.addEventListener('change', applyFiltersAndRender);
    fulfillmentSelect.addEventListener('change', applyFiltersAndRender);
    fromDateInput.addEventListener('change', applyFiltersAndRender);
    toDateInput.addEventListener('change', applyFiltersAndRender);

    // Row click → open detail panel
    tableBody.addEventListener('click', (e) => {
      const tr = e.target.closest('tr');
      if (!tr || !tr.dataset.orderId) return;
      openOrderPanel(tr.dataset.orderId);
    });

    // ─────────────────────────────────────────────────────────────────────
    // PANEL — open / close
    // ─────────────────────────────────────────────────────────────────────

    function openPanel() {
      panel.classList.add('open');
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePanel() {
      panel.classList.remove('open');
      overlay.classList.remove('open');
      document.body.style.overflow = '';
      currentOrder = null;
    }

    overlay.addEventListener('click', closePanel);
    document.getElementById('panelCloseBtn').addEventListener('click', closePanel);
    document.getElementById('panelCancelBtn').addEventListener('click', closePanel);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && panel.classList.contains('open')) closePanel();
    });

    // ─────────────────────────────────────────────────────────────────────
    // PANEL — load and render a single order
    // ─────────────────────────────────────────────────────────────────────

    async function openOrderPanel(orderId) {
      panelTitle.textContent = 'Order Details';
      panelBody.innerHTML = '<div class="panel-loading">Loading…</div>';
      openPanel();

      // Pull the full order plus its line items, joined through variants to products
      const { data: order, error } = await supabase
        .from('orders')
        .select(`
          id, order_number, customer_name, customer_email, customer_phone, shipping_address,
          total_amount, payment_status, fulfillment_status, paymongo_payment_id, payment_provider, payment_reference,
          tracking_number, internal_notes, created_at,
          refunded_amount, cancelled_at, cancel_reason, paid_at,
          order_refunds ( kind, amount, method, reason, note, provider_refund_id, items, created_by_email, created_at ),
          order_items (
            id, variant_id, quantity, price_at_purchase,
            variants (
              id, color, size, sku,
              products ( name )
            )
          )
        `)
        .eq('id', orderId)
        .single();

      if (error || !order) {
        console.error(error);
        panelBody.innerHTML = '<div class="panel-loading">Could not load this order.</div>';
        return;
      }

      currentOrder = order;
      panelTitle.textContent = order.order_number;
      renderOrderPanel(order);
    }

    function renderOrderPanel(order) {
      const created = new Date(order.created_at);
      const dateStr = created.toLocaleString('en-PH', {
        year:  'numeric',
        month: 'short',
        day:   'numeric',
        hour:  'numeric',
        minute:'2-digit',
      });

      // ── Build the line items HTML ──
      const itemRows = (order.order_items || []).map(it => {
        const v   = it.variants;
        const p   = v?.products;
        const sub = Number(it.price_at_purchase) * it.quantity;

        return `
          <tr>
            <td>
              <div class="item-name">${escapeHtml(p?.name ?? 'Unknown product')}</div>
              <div class="item-variant">
                ${escapeHtml(v?.color ?? '')} · ${escapeHtml(v?.size ?? '')}
                · <span style="font-family:monospace;">${escapeHtml(v?.sku ?? '')}</span>
              </div>
            </td>
            <td class="item-qty">×${it.quantity}</td>
            <td class="item-price">${formatPrice(sub)}</td>
          </tr>
        `;
      }).join('');

      // Subtotal = what the items cost. Anything above that in the total is shipping.
      const itemsSubtotal = (order.order_items || [])
        .reduce((sum, it) => sum + Number(it.price_at_purchase) * it.quantity, 0);
      const shippingFee = Math.max(0, Number(order.total_amount) - itemsSubtotal);

      // ── Render the full panel body ──
      panelBody.innerHTML = `
        <!-- Order summary block at the top -->
        <div class="order-summary">
          <div class="summary-row-top">
            <span class="order-number">${escapeHtml(order.order_number)}</span>
            <span class="order-date">${dateStr}</span>
          </div>
          <div class="summary-badges">
            <span class="status-badge pay-${order.payment_status}">
              Payment: ${PAYMENT_LABELS[order.payment_status]}
            </span>
            <span class="status-badge ful-${order.fulfillment_status}">
              Fulfillment: ${FULFILLMENT_LABELS[order.fulfillment_status]}
            </span>
          </div>
          <div class="summary-total">
            <span class="summary-total-label">Order Total</span>
            <span class="summary-total-value">${formatPrice(order.total_amount)}</span>
          </div>
        </div>

        <!-- Customer info -->
        <section class="order-section">
          <h3 class="section-heading">Customer</h3>
          <div class="info-row">
            <span class="info-label">Name</span>
            <span class="info-value">${escapeHtml(order.customer_name)}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Email</span>
            <span class="info-value">
              <a href="mailto:${escapeHtml(order.customer_email)}">${escapeHtml(order.customer_email)}</a>
            </span>
          </div>
          <div class="info-row">
            <span class="info-label">Phone</span>
            <span class="info-value">
              ${order.customer_phone
                ? `<a href="tel:${escapeHtml(order.customer_phone)}">${escapeHtml(order.customer_phone)}</a>`
                : '<span style="color:#aaa;">—</span>'}
            </span>
          </div>
          <div class="info-row">
            <span class="info-label">Shipping</span>
            <span class="info-value">${escapeHtml(order.shipping_address)}</span>
          </div>
        </section>

        <!-- Line items -->
        <section class="order-section">
          <h3 class="section-heading">Items</h3>
          <table class="items-table">
            <tbody>${itemRows || '<tr><td colspan="3" style="color:#aaa;">No items.</td></tr>'}</tbody>
          </table>
          <!-- Items add up to the subtotal; the difference to the total is the
               shipping fee charged at checkout. -->
          <div class="items-subline">
            <span>Subtotal</span>
            <span>${formatPrice(itemsSubtotal)}</span>
          </div>
          <div class="items-subline">
            <span>Shipping</span>
            <span>${shippingFee > 0 ? formatPrice(shippingFee) : 'Free'}</span>
          </div>
          <div class="items-total">
            <span>Total</span>
            <span>${formatPrice(order.total_amount)}</span>
          </div>
          <button type="button" class="btn-print" id="printSlipBtn">🖨 Print packing slip</button>
        </section>

        <!-- Payment info (read-only — payment_status is set automatically once Maya confirms payment) -->
        <section class="order-section">
          <h3 class="section-heading">Payment</h3>
          <div class="info-row">
            <span class="info-label">Status</span>
            <span class="info-value">
              <span class="status-badge pay-${order.payment_status}">${PAYMENT_LABELS[order.payment_status]}</span>
            </span>
          </div>
          <div class="info-row">
            <!-- Shows which company took the payment and its reference id
                 (older orders only have paymongo_payment_id) -->
            <span class="info-label">${order.payment_provider === 'paymongo' || (!order.payment_provider && order.paymongo_payment_id) ? 'PayMongo' : 'Maya'}&nbsp;ID</span>
            <span class="info-value">
              ${(order.payment_reference || order.paymongo_payment_id)
                ? `<span class="paymongo-id">${escapeHtml(order.payment_reference || order.paymongo_payment_id)}</span>`
                : '<span class="paymongo-id paymongo-id-empty">— not yet recorded —</span>'}
            </span>
          </div>
          ${isPayMongoOrder(order) ? '' : `
          <div class="info-row">
            <!-- Maya calls our order id the "Request Reference Number". Search
                 for it in Maya Manager to find this payment. -->
            <span class="info-label">Maya ref #</span>
            <span class="info-value">
              <span class="paymongo-id">${escapeHtml(order.id)}</span>
              <button type="button" class="btn-print" style="margin:0 0 0 0.4rem;padding:0.15rem 0.5rem;font-size:0.75rem;"
                      data-copy="${escapeHtml(order.id)}">Copy</button>
            </span>
          </div>`}
        </section>

        <!-- Editable: fulfillment status + tracking number -->
        <section class="order-section">
          <h3 class="section-heading">Fulfillment</h3>
          <div class="field">
            <label for="fulfillmentSelect">Status</label>
            <select id="fulfillmentSelect" ${order.fulfillment_status === 'cancelled' ? 'disabled' : ''}>
              ${order.fulfillment_status === 'cancelled' ? '<option value="cancelled" selected>Cancelled</option>' : ''}
              <option value="pending"   ${order.fulfillment_status === 'pending'   ? 'selected' : ''}>Pending</option>
              <option value="packed"    ${order.fulfillment_status === 'packed'    ? 'selected' : ''}>Packed</option>
              <option value="shipped"   ${order.fulfillment_status === 'shipped'   ? 'selected' : ''}>Shipped</option>
              <option value="delivered" ${order.fulfillment_status === 'delivered' ? 'selected' : ''}>Delivered</option>
            </select>
          </div>
          <div class="field">
            <label for="trackingInput">Tracking Number</label>
            <input
              type="text"
              id="trackingInput"
              placeholder="e.g. JNT1234567890"
              value="${escapeHtml(order.tracking_number ?? '')}"
            />
            <div class="tracking-warning" id="trackingWarning">
              Please enter a tracking number — this order is marked as shipped.
            </div>
            ${order.payment_status !== 'paid' ? `
              <div class="unpaid-warning">
                ⚠ This order is <strong>not paid</strong>. Do not pack or ship it until
                the payment shows as Paid.
              </div>` : ''}
          </div>
        </section>

        <!-- Editable: internal staff notes -->
        <section class="order-section">
          <h3 class="section-heading">Internal Notes</h3>
          <div class="field">
            <textarea
              id="notesInput"
              placeholder="Notes for staff only — e.g. 'called customer to confirm address'…"
            >${escapeHtml(order.internal_notes ?? '')}</textarea>
          </div>
        </section>

        <!-- Cancel / refund / return. Filled in by renderRefundSection(). -->
        <section class="order-section" id="refundSection"></section>

        <!-- Inline error appears here when save validation fails -->
        <div class="panel-error" id="panelError"></div>
      `;

      renderRefundSection(order);

      // ── Wire up dynamic behavior on the rendered form ──
      const fulSelect   = document.getElementById('fulfillmentSelect');
      const trackingIn  = document.getElementById('trackingInput');
      const trackingWarn = document.getElementById('trackingWarning');

      // When fulfillment is set to "shipped" and tracking is empty, show
      // a warning + autofocus the tracking field (the "prompt").
      function updateTrackingWarning() {
        const needsTracking = fulSelect.value === 'shipped' && !trackingIn.value.trim();
        trackingWarn.classList.toggle('visible', needsTracking);
      }

      fulSelect.addEventListener('change', () => {
        // If they just switched to shipped without tracking, focus the field
        if (fulSelect.value === 'shipped' && !trackingIn.value.trim()) {
          trackingIn.focus();
        }
        updateTrackingWarning();
      });

      trackingIn.addEventListener('input', updateTrackingWarning);

      // Initial check (in case the order is already shipped with no tracking yet)
      updateTrackingWarning();

      document.getElementById('printSlipBtn').addEventListener('click', () => printPackingSlip(order));
    }

    // ─────────────────────────────────────────────────────────────────────
    // CANCEL / REFUND
    // The buttons here open a small form. Submitting it calls the server
    // (/api/admin-order), which sends the money back through PayMongo if
    // asked, puts items back in stock, and saves a history row.
    //
    // Rules (the server checks them again):
    //   Cancel  → only before shipping. Paid orders: all items go back to
    //             online stock + the money is refunded.
    //   Return / refund → paid orders. Pick items that came back (and where
    //             they go in stock) and how much money to return.
    // ─────────────────────────────────────────────────────────────────────

    const REASON_OPTIONS = `
      <option value="">Choose a reason…</option>
      <option value="customer_request">Customer asked</option>
      <option value="out_of_stock">Out of stock</option>
      <option value="damaged">Damaged / defective</option>
      <option value="wrong_item">Wrong item sent</option>
      <option value="other">Other</option>`;

    // How much is left to refund, and how many of each item can still come back
    function refundState(order) {
      const stillOwed = Math.round((Number(order.total_amount) - Number(order.refunded_amount || 0)) * 100) / 100;
      const returned = {};
      for (const r of order.order_refunds || []) {
        for (const it of r.items || []) returned[it.variant_id] = (returned[it.variant_id] || 0) + it.quantity;
      }
      const items = (order.order_items || []).map(it => ({
        variantId: it.variant_id,
        name:      `${it.variants?.products?.name ?? 'Item'} — ${it.variants?.color ?? ''} ${it.variants?.size ?? ''}`.trim(),
        price:     Number(it.price_at_purchase),
        left:      it.quantity - (returned[it.variant_id] || 0),
      }));
      return { stillOwed, items };
    }

    // Was this order paid through PayMongo? (Only older orders — the shop now uses Maya.)
    function isPayMongoOrder(order) {
      return order.payment_provider === 'paymongo' || (!order.payment_provider && !!order.paymongo_payment_id);
    }

    // Step-by-step for refunding a Maya payment. Maya only lets us refund from
    // Maya Manager (its website) until Maya switches on refunds through code.
    function mayaRefundSteps(order) {
      const paidDay = order.paid_at ?? order.created_at;
      const sameDay = new Date(paidDay).toLocaleDateString('en-PH', { timeZone: 'Asia/Manila' })
                   === new Date().toLocaleDateString('en-PH', { timeZone: 'Asia/Manila' });
      return `
        <div class="cancelled-note" style="background:#fff8e6;border-left-color:#C9A84C;">
          <strong>First, send the money back in Maya Manager:</strong>
          <ol style="margin:0.4rem 0 0 1.1rem;padding:0;line-height:1.55;">
            <li>Log in to <a href="https://manager.paymaya.com" target="_blank" rel="noopener">Maya Manager</a> → Transactions.</li>
            <li>Search the reference number
              <code style="font-size:0.75rem;">${escapeHtml(order.id)}</code>
              <button type="button" class="btn-print" style="margin:0;padding:0.1rem 0.45rem;font-size:0.72rem;" data-copy="${escapeHtml(order.id)}">Copy</button></li>
            <li>${sameDay
              ? 'It was paid <strong>today</strong>, so click <strong>Void</strong> (voids return the full amount only). For a partial refund, wait until tomorrow.'
              : 'Click <strong>Refund</strong> and enter the amount (partial refunds are OK, up to 180 days after payment).'}</li>
            <li>Come back here and press the button below to record it.</li>
          </ol>
        </div>`;
    }

    // The "how is the money returned?" choices
    function refundMethodChoices(order, amountText) {
      if (isPayMongoOrder(order)) {
        // Old PayMongo orders can still be refunded automatically
        return `
          <label class="radio"><input type="radio" name="refundMethod" value="paymongo" checked />
            <span><strong>Refund ${amountText} now through PayMongo</strong> (this older order was paid with PayMongo).</span></label>
          <label class="radio"><input type="radio" name="refundMethod" value="manual" />
            <span><strong>I already refunded it another way</strong> (bank transfer, GCash, cash). Just record it.</span></label>
          <label class="radio"><input type="radio" name="refundMethod" value="none" />
            <span><strong>Don't return money</strong> (e.g. store credit or exchange).</span></label>`;
      }
      return `
        ${mayaRefundSteps(order)}
        <label class="radio"><input type="radio" name="refundMethod" value="manual" checked />
          <span><strong>I refunded ${amountText} in Maya Manager</strong> (or by bank transfer / GCash / cash).</span></label>
        <label class="radio"><input type="radio" name="refundMethod" value="none" />
          <span><strong>Don't return money</strong> (e.g. store credit or exchange).</span></label>`;
    }

    // Any "Copy" button in the panel copies its reference number
    panelBody.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-copy]');
      if (!btn) return;
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        showToast('Reference number copied.');
      } catch {
        window.prompt('Copy this reference number:', btn.dataset.copy);
      }
    });

    function renderRefundSection(order) {
      const box = document.getElementById('refundSection');
      const isPaid      = order.payment_status === 'paid';
      const isCancelled = order.fulfillment_status === 'cancelled';
      const canCancel   = !isCancelled && ['pending', 'packed'].includes(order.fulfillment_status);
      const { stillOwed, items } = refundState(order);
      const canRefund   = isPaid && (stillOwed > 0 || items.some(i => i.left > 0));

      const history = (order.order_refunds || [])
        .slice().sort((a, b) => a.created_at.localeCompare(b.created_at))
        .map(r => {
          const when  = new Date(r.created_at).toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
          const count = (r.items || []).reduce((n, i) => n + i.quantity, 0);
          const how   = { paymongo: 'via PayMongo', manual: 'recorded (refunded outside)', none: 'no money returned' }[r.method];
          return `<li><strong>${r.kind === 'cancel' ? 'Cancelled' : 'Refund'}</strong> · ${when}<br>
            ${formatPrice(r.amount)} ${how}${count ? ` · ${count} item${count === 1 ? '' : 's'} returned` : ''}
            · ${escapeHtml(r.reason ?? '')}${r.note ? ` — ${escapeHtml(r.note)}` : ''}
            <br><span style="color:#999">by ${escapeHtml(r.created_by_email ?? 'staff')}${r.provider_refund_id ? ` · ${escapeHtml(r.provider_refund_id)}` : ''}</span></li>`;
        }).join('');

      box.innerHTML = `
        <h3 class="section-heading">Cancel or Refund</h3>
        ${isCancelled ? `<div class="cancelled-note">This order was <strong>cancelled</strong>
            ${order.cancelled_at ? 'on ' + escapeHtml(new Date(order.cancelled_at).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' })) : ''}.
            ${order.cancel_reason ? '<br>Reason: ' + escapeHtml(order.cancel_reason) : ''}</div>` : ''}
        ${Number(order.refunded_amount) > 0 ? `<p style="font-size:0.85rem;margin-bottom:0.5rem;">
            Refunded so far: <strong>${formatPrice(order.refunded_amount)}</strong> of ${formatPrice(order.total_amount)}</p>` : ''}
        <div class="refund-actions">
          ${canCancel ? '<button type="button" class="btn-danger-outline" data-open="cancel">Cancel order</button>' : ''}
          ${canRefund ? '<button type="button" class="btn-danger-outline" data-open="refund">Return / refund</button>' : ''}
          ${!canCancel && !canRefund && !isCancelled ? '<p style="font-size:0.8rem;color:#999;">Nothing to cancel or refund on this order.</p>' : ''}
        </div>
        <div id="refundFormSlot"></div>
        ${history ? `<ul class="refund-history">${history}</ul>` : ''}
      `;

      box.querySelector('[data-open="cancel"]')?.addEventListener('click', () => openCancelForm(order));
      box.querySelector('[data-open="refund"]')?.addEventListener('click', () => openRefundForm(order));
    }

    function openCancelForm(order) {
      const isPaid = order.payment_status === 'paid';
      const { stillOwed, items } = refundState(order);
      const itemCount = items.reduce((n, i) => n + Math.max(0, i.left), 0);
      const slot = document.getElementById('refundFormSlot');

      slot.innerHTML = `
        <div class="refund-form">
          <h4>Cancel this order</h4>
          <p class="help">${isPaid
            ? `All ${itemCount} item${itemCount === 1 ? '' : 's'} go back into <strong>online stock</strong> automatically.`
            : `This order was <strong>never paid</strong>, so no money or stock needs to move. It will just be marked Cancelled.`}</p>
          <div class="field"><label>Reason</label><select id="rfReason">${REASON_OPTIONS}</select></div>
          <div class="field"><label>Note (optional)</label><input type="text" id="rfNote" placeholder="e.g. customer changed their mind" /></div>
          ${isPaid ? `<div style="margin-top:0.5rem;">${refundMethodChoices(order, formatPrice(stillOwed))}</div>` : ''}
          <button type="button" class="btn-danger" id="rfSubmit">Cancel order${isPaid ? ' and refund' : ''}</button>
          <button type="button" class="btn-cancel" id="rfClose" style="width:100%;margin-top:0.4rem;">Never mind</button>
        </div>`;

      slot.querySelector('#rfClose').addEventListener('click', () => { slot.innerHTML = ''; });
      slot.querySelector('#rfSubmit').addEventListener('click', () => {
        const method = isPaid ? slot.querySelector('input[name="refundMethod"]:checked')?.value : 'none';
        submitOrderAction(order, {
          action: 'cancel',
          reason: slot.querySelector('#rfReason').value,
          note:   slot.querySelector('#rfNote').value,
          refundMethod: method,
        }, method === 'paymongo'
          ? `Cancel ${order.order_number} and send ${formatPrice(stillOwed)} back to the customer through PayMongo? This cannot be undone.`
          : method === 'manual'
            ? `Have you already refunded ${formatPrice(stillOwed)} in Maya Manager? Press OK to cancel ${order.order_number} and record the refund.`
            : `Cancel ${order.order_number}? This cannot be undone.`);
      });
    }

    function openRefundForm(order) {
      const { stillOwed, items } = refundState(order);
      const slot = document.getElementById('refundFormSlot');
      const subtotal = items.reduce((s, i) => s + i.price * (order.order_items.find(x => x.variant_id === i.variantId)?.quantity ?? 0), 0);
      const shipping = Math.max(0, Number(order.total_amount) - subtotal);

      slot.innerHTML = `
        <div class="refund-form">
          <h4>Return / refund</h4>
          <p class="help">Enter how many of each item came back and where it goes. Damaged items?
            Choose "Don't put back in stock". The refund amount fills in by itself — you can change it.
            For a refund without a return (e.g. a goodwill discount), leave all items at 0.</p>
          ${items.map((it, idx) => `
            <div class="return-item">
              <div>${escapeHtml(it.name)}<br><span style="color:#999">${formatPrice(it.price)} each · ${Math.max(0, it.left)} can be returned</span></div>
              <input type="number" min="0" max="${Math.max(0, it.left)}" value="0" data-qty="${idx}" ${it.left <= 0 ? 'disabled' : ''} inputmode="numeric" aria-label="Quantity returned" />
              <select data-restock="${idx}" aria-label="Where does it go">
                <option value="online">Put back in online stock</option>
                <option value="greenhills_store">Put back in Greenhills store stock</option>
                <option value="">Don't put back in stock (damaged)</option>
              </select>
            </div>`).join('')}
          ${shipping > 0 ? `<label class="radio"><input type="checkbox" id="rfShipping" />
            <span>Also refund the shipping fee (${formatPrice(shipping)})</span></label>` : ''}
          <div class="field" style="margin-top:0.5rem;"><label>Amount to refund (₱) — at most ${formatPrice(stillOwed)}</label>
            <input type="number" id="rfAmount" min="0" max="${stillOwed}" step="0.01" value="0" /></div>
          <div class="field"><label>Reason</label><select id="rfReason">${REASON_OPTIONS}</select></div>
          <div class="field"><label>Note (optional)</label><input type="text" id="rfNote" placeholder="e.g. size too small, returned at Greenhills" /></div>
          <div style="margin-top:0.5rem;">${refundMethodChoices(order, 'the amount above')}</div>
          <button type="button" class="btn-danger" id="rfSubmit">Save return / refund</button>
          <button type="button" class="btn-cancel" id="rfClose" style="width:100%;margin-top:0.4rem;">Never mind</button>
        </div>`;

      const amountIn = slot.querySelector('#rfAmount');
      let amountTouched = false;
      amountIn.addEventListener('input', () => { amountTouched = true; });

      // Keep the amount = returned items (+ shipping if ticked), until staff type their own
      function recalc() {
        if (amountTouched) return;
        let sum = 0;
        slot.querySelectorAll('[data-qty]').forEach(inp => {
          sum += (parseInt(inp.value, 10) || 0) * items[Number(inp.dataset.qty)].price;
        });
        if (slot.querySelector('#rfShipping')?.checked) sum += shipping;
        amountIn.value = Math.min(stillOwed, Math.round(sum * 100) / 100).toFixed(2);
      }
      slot.addEventListener('input', (e) => { if (e.target !== amountIn) recalc(); });
      slot.addEventListener('change', (e) => { if (e.target !== amountIn) recalc(); });

      slot.querySelector('#rfClose').addEventListener('click', () => { slot.innerHTML = ''; });
      slot.querySelector('#rfSubmit').addEventListener('click', () => {
        const chosen = [...slot.querySelectorAll('[data-qty]')]
          .map(inp => {
            const idx = Number(inp.dataset.qty);
            return {
              variantId:      items[idx].variantId,
              quantity:       parseInt(inp.value, 10) || 0,
              restockChannel: slot.querySelector(`[data-restock="${idx}"]`).value || null,
            };
          })
          .filter(i => i.quantity > 0);
        const method = slot.querySelector('input[name="refundMethod"]:checked')?.value;
        const amount = Number(amountIn.value) || 0;
        submitOrderAction(order, {
          action: 'refund',
          reason: slot.querySelector('#rfReason').value,
          note:   slot.querySelector('#rfNote').value,
          refundMethod: method,
          amount,
          items:  chosen,
        }, method === 'paymongo' && amount > 0
          ? `Send ${formatPrice(amount)} back to the customer through PayMongo? This cannot be undone.`
          : method === 'manual' && amount > 0
            ? `Have you already refunded ${formatPrice(amount)} in Maya Manager? Press OK to record it on ${order.order_number}.`
            : `Save this return / refund on ${order.order_number}?`);
      });
    }

    // Send the cancel/refund to the server, then reload the order
    async function submitOrderAction(order, payload, confirmText) {
      const slot = document.getElementById('refundFormSlot');
      const btn  = slot.querySelector('#rfSubmit');

      if (!payload.reason) { showToast('Please choose a reason.'); slot.querySelector('#rfReason').focus(); return; }
      if (!payload.refundMethod) { showToast('Please choose how the money is returned.'); return; }
      if (!window.confirm(confirmText)) return;

      btn.disabled = true;
      btn.textContent = 'Working…';

      try {
        // Fresh token, in case the page has been open for a long time
        const { data: { session: s } } = await supabase.auth.getSession();
        const res = await fetch('/api/admin-order', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${s?.access_token}` },
          body:    JSON.stringify({ orderId: order.id, ...payload }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || 'Something went wrong. Please try again.');

        showToast(payload.action === 'cancel' ? 'Order cancelled.' : 'Return / refund saved.');
        await openOrderPanel(order.id);  // show the updated order
        loadOrders();                    // refresh the list in the background
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = 'Try again';
        window.alert(err.message);
      }
    }

    // ─────────────────────────────────────────────────────────────────────
    // PACKING SLIP
    // Opens a plain, printer-friendly page with the customer's address and
    // the list of items, then shows the browser's print dialog. Put the
    // printout inside the parcel or use it as a picking list.
    // ─────────────────────────────────────────────────────────────────────

    function printPackingSlip(order) {
      const rows = (order.order_items || []).map(it => {
        const v = it.variants;
        return `<tr>
          <td>${escapeHtml(v?.products?.name ?? 'Unknown product')}</td>
          <td>${escapeHtml(v?.color ?? '')}</td>
          <td>${escapeHtml(v?.size ?? '')}</td>
          <td style="font-family:monospace">${escapeHtml(v?.sku ?? '')}</td>
          <td style="text-align:center">${it.quantity}</td>
          <td style="text-align:center">☐</td>
        </tr>`;
      }).join('');

      const date = new Date(order.created_at).toLocaleDateString('en-PH', {
        year: 'numeric', month: 'long', day: 'numeric',
      });

      const win = window.open('', '_blank');
      if (!win) { showToast('Allow pop-ups for this site to print packing slips.'); return; }

      win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
        <title>Packing slip ${escapeHtml(order.order_number)}</title>
        <style>
          body { font-family: Arial, sans-serif; color: #111; padding: 24px; max-width: 760px; margin: 0 auto; }
          h1 { font-size: 20px; margin: 0 0 4px; }
          .muted { color: #555; font-size: 13px; }
          .box { border: 1px solid #999; padding: 12px 14px; margin: 16px 0; }
          .box h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; color: #555; }
          table { width: 100%; border-collapse: collapse; font-size: 14px; }
          th, td { border-bottom: 1px solid #ccc; padding: 8px 6px; text-align: left; }
          th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #555; }
          .note { white-space: pre-wrap; }
        </style></head><body>
        <h1>Ducks Unlimited — Packing slip</h1>
        <div class="muted">Order <strong>${escapeHtml(order.order_number)}</strong> · ${escapeHtml(date)}</div>

        <div class="box">
          <h2>Ship to</h2>
          <div><strong>${escapeHtml(order.customer_name)}</strong></div>
          <div>${escapeHtml(order.shipping_address)}</div>
          <div>${escapeHtml(order.customer_phone ?? '')}</div>
        </div>

        <table>
          <thead><tr><th>Item</th><th>Color</th><th>Size</th><th>SKU</th><th style="text-align:center">Qty</th><th style="text-align:center">Packed</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>

        ${order.internal_notes ? `<div class="box"><h2>Staff notes</h2><div class="note">${escapeHtml(order.internal_notes)}</div></div>` : ''}

        <p class="muted" style="margin-top:24px">Thank you for shopping with us!</p>
        <script>window.onload = () => window.print();<\/script>
        </body></html>`);
      win.document.close();
    }

    // ─────────────────────────────────────────────────────────────────────
    // SAVE
    // ─────────────────────────────────────────────────────────────────────

    saveBtn.addEventListener('click', handleSave);

    async function handleSave() {
      if (!currentOrder) return;

      const fulSelect  = document.getElementById('fulfillmentSelect');
      const trackingIn = document.getElementById('trackingInput');
      const notesIn    = document.getElementById('notesInput');
      const errorEl    = document.getElementById('panelError');

      const newFulfillment = fulSelect.value;
      const newTracking    = trackingIn.value.trim();
      const newNotes       = notesIn.value;

      function showPanelError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add('visible');
      }

      function clearPanelError() {
        errorEl.textContent = '';
        errorEl.classList.remove('visible');
      }

      clearPanelError();

      // Block save if marking as shipped without a tracking number — this is
      // what the spec means by "prompt the manager to enter a tracking number".
      if (newFulfillment === 'shipped' && !newTracking) {
        showPanelError('Please enter a tracking number before marking this order as shipped.');
        trackingIn.focus();
        return;
      }

      // Packing / shipping an unpaid order is almost always a mistake — ask first.
      if (currentOrder.payment_status !== 'paid'
          && newFulfillment !== 'pending'
          && newFulfillment !== currentOrder.fulfillment_status) {
        const ok = window.confirm('This order is NOT PAID yet. Are you sure you want to mark it as '
          + FULFILLMENT_LABELS[newFulfillment] + '?');
        if (!ok) return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';

      const { error } = await supabase
        .from('orders')
        .update({
          // A cancelled order stays cancelled — only /api/admin-order changes that
          ...(currentOrder.fulfillment_status === 'cancelled' ? {} : { fulfillment_status: newFulfillment }),
          // Store empty tracking / notes as null rather than empty strings,
          // so the DB clearly says "no value here yet"
          tracking_number:    newTracking || null,
          internal_notes:     newNotes.trim() || null,
        })
        .eq('id', currentOrder.id);

      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Changes';

      if (error) {
        console.error(error);
        showPanelError('Could not save changes. Please try again.');
        return;
      }

      closePanel();
      showToast('Order updated.');
      await loadOrders(); // refresh list so the new status is reflected
    }


    // ── Initial load ──
    await loadOrders();

    // Deep-link support: /admin/orders.html?order=<id>
    // Auto-opens the detail panel for that order. Used by the dashboard's
    // Recent Orders table so clicking lands directly on the right one.
    const orderParam = new URLSearchParams(window.location.search).get('order');
    if (orderParam) openOrderPanel(orderParam);
  </script>

  <!-- Mounts the shared <div data-component="admin-nav"> at the top of <body> -->
  <script type="module" src="/js/components.js"></script>

</body>
</html>
