<!-- =============================================================================
     Ducks Unlimited + Rocwood — Mini Cart (slide-in confirmation)
     =============================================================================
     Panel that slides in from the right when the customer adds something to
     their cart. Shows the whole cart, newest item first and split by brand
     when it holds both, plus a running subtotal, with "View Cart" and
     "Checkout" buttons. Dismisses on close click, backdrop click, or Esc.
     It doesn't close on a timer, so there's time to read a long cart.

     Why not a modal: a modal hijacks the page. The mini cart just confirms
     the add without pulling the customer out of browsing — Baymard shows
     this lifts cart-add → checkout rates meaningfully.

     Mounted via /js/components.js's recursive pass (slot lives inside
     /components/nav.html).
     ============================================================================= -->

<div class="mini-cart" data-mini-cart hidden>
  <div class="mini-cart__backdrop" data-mini-cart-backdrop></div>

  <aside class="mini-cart__panel" role="dialog" aria-label="Added to bag">
    <header class="mini-cart__head">
      <span class="mini-cart__eyebrow">Added to bag</span>
      <button type="button" class="mini-cart__close" aria-label="Close">×</button>
    </header>

    <!-- Everything in the cart. Filled by the script below. -->
    <div class="mini-cart__items" data-mini-cart-items></div>

    <div class="mini-cart__summary">
      <div class="mini-cart__summary-row">
        <span>Subtotal</span>
        <strong data-mini-cart-subtotal>₱0.00</strong>
      </div>
      <small class="mini-cart__summary-note" data-mini-cart-count>0 items in your bag</small>
    </div>

    <div class="mini-cart__actions">
      <a href="/cart.html"     class="mini-cart__btn mini-cart__btn--secondary">View Bag</a>
      <a href="/checkout.html" class="mini-cart__btn mini-cart__btn--primary">Checkout</a>
    </div>
  </aside>
</div>

<style>
  .mini-cart[hidden] { display: none; }

  .mini-cart {
    position: fixed;
    inset: 0;
    z-index: 200;
    pointer-events: none;
  }

  .mini-cart__backdrop {
    position: absolute;
    inset: 0;
    background: rgba(26,26,26,0.35);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: auto;
  }

  .mini-cart.is-open .mini-cart__backdrop { opacity: 1; }

  .mini-cart__panel {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(380px, 92vw);
    background: var(--color-white);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: 1.25rem;
    box-shadow: -8px 0 32px rgba(0,0,0,0.15);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    pointer-events: auto;
  }

  .mini-cart.is-open .mini-cart__panel { transform: translateX(0); }

  .mini-cart__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--color-border-light);
  }

  .mini-cart__eyebrow {
    font-family: var(--font-body);
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-accent);
  }

  .mini-cart__close {
    background: none;
    border: none;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--color-text-muted);
    cursor: pointer;
    padding: 0.25rem 0.5rem;
  }

  .mini-cart__close:hover { color: var(--color-text); }

  /* ── The cart's items. This part scrolls; the buttons stay on screen. ── */
  .mini-cart__items {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }

  /* Brand name over each group when the cart holds both brands */
  .mini-cart__brand {
    font-family: var(--font-heading);
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--color-text);
    margin: 0 0 0.25rem;
  }

  .mini-cart__brand:not(:first-child) { margin-top: 1.25rem; }

  .mini-cart__item {
    display: flex;
    gap: 0.9rem;
    align-items: flex-start;
    padding: 0.5rem 0;
  }

  .mini-cart__thumb {
    flex: 0 0 70px;
    aspect-ratio: 3 / 4;
    background: var(--color-bg-warm);
    overflow: hidden;
    border-radius: 2px;
  }

  .mini-cart__thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .mini-cart__thumb--empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-light);
    font-size: 0.7rem;
  }

  .mini-cart__info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .mini-cart__name {
    font-family: var(--font-heading);
    font-size: 1rem;
    color: var(--color-text);
    line-height: 1.3;
  }

  .mini-cart__variant {
    font-size: 0.78rem;
    color: var(--color-text-muted);
  }

  .mini-cart__meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--color-text);
    margin-top: 0.15rem;
  }

  /* ── Summary ── */
  .mini-cart__summary {
    margin-top: auto;
    padding-top: 0.75rem;
    border-top: 1px solid var(--color-border-light);
  }

  .mini-cart__summary-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.9rem;
    color: var(--color-text);
  }

  .mini-cart__summary-row strong {
    font-family: var(--font-heading);
    font-size: 1.25rem;
    font-weight: 600;
  }

  .mini-cart__summary-note {
    display: block;
    font-size: 0.72rem;
    color: var(--color-text-muted);
    margin-top: 0.25rem;
  }

  /* ── Actions ── */
  .mini-cart__actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
  }

  .mini-cart__btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.8rem 1rem;
    font-family: var(--font-body);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid var(--color-primary);
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }

  .mini-cart__btn--secondary {
    background: var(--color-white);
    color: var(--color-primary);
  }

  .mini-cart__btn--secondary:hover {
    background: var(--color-bg-warm);
    text-decoration: none;
  }

  .mini-cart__btn--primary {
    background: var(--color-primary);
    color: var(--color-white);
  }

  .mini-cart__btn--primary:hover {
    background: var(--color-primary-dark);
    text-decoration: none;
    color: var(--color-white);
  }
</style>

<script type="module">
  import { getCartNewestFirst, getCartTotal, getCartCount } from '/js/cart.js';

  const mc = document.querySelector('[data-mini-cart]');
  // Guard: this script runs via the components loader on every page, but
  // only pages that mount the mini-cart component have the panel in DOM.
  // Using an if-wrap because top-level `return` isn't valid in ES modules.
  if (mc) {
  const itemsSlot     = mc.querySelector('[data-mini-cart-items]');
  const subtotalSlot  = mc.querySelector('[data-mini-cart-subtotal]');
  const countSlot     = mc.querySelector('[data-mini-cart-count]');
  const backdrop      = mc.querySelector('[data-mini-cart-backdrop]');
  const closeBtn      = mc.querySelector('.mini-cart__close');

  const PHP = new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP', minimumFractionDigits: 2 });

  // Brands we had to look up, keyed by variant id (see fetchMissingBrands)
  const lookedUpBrands = {};

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])
    );
  }

  function renderItem(item) {
    const total     = (Number(item.price) || 0) * (Number(item.quantity) || 1);
    const thumbHtml = item.imageUrl
      ? `<img src="${esc(item.imageUrl)}" alt="" />`
      : '';  // empty tile in the brand's warm tone (no "No image" text)

    return `
      <div class="mini-cart__item">
        <div class="mini-cart__thumb ${item.imageUrl ? '' : 'mini-cart__thumb--empty'}">${thumbHtml}</div>
        <div class="mini-cart__info">
          <span class="mini-cart__name">${esc(item.productName || 'Added to bag')}</span>
          ${item.variantLabel ? `<span class="mini-cart__variant">${esc(item.variantLabel)}</span>` : ''}
          <div class="mini-cart__meta">
            <span>Qty ${Number(item.quantity) || 1}</span>
            <span>${PHP.format(total)}</span>
          </div>
        </div>
      </div>
    `;
  }

  // A line's brand: saved on the line, or looked up for older carts.
  function brandOf(item) {
    return item.brandSlug
      ? { slug: item.brandSlug, name: item.brandName }
      : lookedUpBrands[item.variantId];
  }

  // Draw the whole cart. The items come newest-first, so each brand stays
  // newest-first and the brand added to most recently comes first — the
  // same order as the cart page. Items with no known brand join the first
  // brand we do know.
  function renderItems() {
    const items    = getCartNewestFirst();
    const fallback = items.map(brandOf).find(Boolean);
    const groups   = [];

    for (const item of items) {
      const brand = brandOf(item) || fallback;
      const slug  = brand?.slug || '';
      let group   = groups.find((g) => g.slug === slug);
      if (!group) {
        group = { slug, name: brand?.name || '', items: [] };
        groups.push(group);
      }
      group.items.push(item);
    }

    // One brand: a plain list. Two brands: a heading over each.
    itemsSlot.innerHTML = groups.map((g) => `
      ${groups.length > 1 ? `<h2 class="mini-cart__brand">${esc(g.name)}</h2>` : ''}
      ${g.items.map(renderItem).join('')}
    `).join('');
    itemsSlot.scrollTop = 0;
  }

  // Lines added before brands were saved on the cart have no brand, so ask
  // the database once, then redraw with the brand headings in place.
  async function fetchMissingBrands() {
    const ids = getCartNewestFirst()
      .filter((item) => !brandOf(item))
      .map((item) => item.variantId);
    if (ids.length === 0) return;

    try {
      const { supabase } = await import('/lib/supabase.js');
      const { data, error } = await supabase
        .from('variants')
        .select('id, products ( brands ( slug, name ) )')
        .in('id', ids);
      if (error) throw error;

      for (const v of (data ?? [])) {
        const brand = v.products?.brands;
        if (brand?.slug) lookedUpBrands[v.id] = brand;
      }
      renderItems();
    } catch (err) {
      // The cart still shows, just without brand headings
      console.error('Mini cart: could not look up brands', err);
    }
  }

  function refreshSummary() {
    subtotalSlot.textContent = PHP.format(getCartTotal());
    const count = getCartCount();
    countSlot.textContent = `${count} ${count === 1 ? 'item' : 'items'} in your bag`;
  }

  function open() {
    mc.hidden = false;
    // Rerun on the next frame so the transition fires from the hidden state.
    requestAnimationFrame(() => mc.classList.add('is-open'));
  }

  function close() {
    mc.classList.remove('is-open');
    setTimeout(() => { mc.hidden = true; }, 300); // match CSS transition
  }

  // Opening on add
  window.addEventListener('cart:add', () => {
    renderItems();
    refreshSummary();
    open();
    fetchMissingBrands();
  });

  // Dismiss controls
  closeBtn.addEventListener('click', close);
  backdrop.addEventListener('click', close);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !mc.hidden) close();
  });
  } // end if (mc)
</script>
