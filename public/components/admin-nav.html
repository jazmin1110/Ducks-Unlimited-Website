<!-- =============================================================================
     Ducks Unlimited — Admin Navigation (shared across all /admin/* pages)
     =============================================================================
     Single source of truth for the admin top bar. Mounted by /js/components.js
     when a page contains: <div data-component="admin-nav"></div>

     What it does:
       - Renders the same nav UI on every admin page
       - Auto-highlights the current page's link based on location.pathname
       - Renders the logged-in admin's email on the right
       - Handles the "Log Out" button (signs out of Supabase, redirects to login)

     Why this exists:
       Before this component, every admin page had its own inline copy of the
       nav markup AND its own nav CSS. Two different visual styles had drifted
       (forest-green pill bar vs. uppercase-text bar). Centralizing fixes that.

     Usage in an admin page:
       1. Add this line where the nav should appear:
            <div data-component="admin-nav"></div>
       2. Include the loader once near the end of <body>:
            <script type="module" src="/js/components.js"></script>
       3. Delete any inline `<nav>` block and its `<style>` rules from the page.
       4. Delete any `logoutBtn` event listener from the page — this file owns it.
     ============================================================================= -->

<header class="admin-nav" data-admin-nav>
  <div class="admin-nav__inner">

    <!-- Brand block (clicks back to dashboard) -->
    <a class="admin-nav__brand" href="/admin/dashboard.html">
      <span class="admin-nav__brand-name">Ducks Unlimited</span>
      <span class="admin-nav__brand-tag">Admin</span>
    </a>

    <!-- Hamburger toggle (mobile only) — checkbox-driven, no JS needed -->
    <input type="checkbox" id="adminNavToggle" class="admin-nav__toggle" aria-label="Toggle admin menu" />
    <label for="adminNavToggle" class="admin-nav__hamburger" aria-hidden="true">
      <span></span><span></span><span></span>
    </label>

    <!-- Primary links -->
    <nav class="admin-nav__menu" aria-label="Admin">
      <ul class="admin-nav__links">
        <li><a href="/admin/dashboard.html" data-path="/admin/dashboard.html">Dashboard</a></li>
        <!-- Ordered by how often staff use them: daily work first, website editing after -->
        <li><a href="/admin/orders.html"    data-path="/admin/orders.html">Orders</a></li>
        <li><a href="/admin/customers.html" data-path="/admin/customers.html">Customers</a></li>
        <li><a href="/admin/products.html"  data-path="/admin/products.html">Products</a></li>
        <li><a href="/admin/inventory.html" data-path="/admin/inventory.html">Inventory</a></li>
        <li><a href="/admin/design.html"    data-path="/admin/design.html">Homepage</a></li>
        <li><a href="/admin/homepage.html"  data-path="/admin/homepage.html">Announcements</a></li>
        <li><a href="/admin/lookbooks.html" data-path="/admin/lookbooks.html">Lookbooks</a></li>
        <li><a href="/admin/gift-cards.html" data-path="/admin/gift-cards.html">Gift Cards</a></li>
        <li><a href="/admin/stores.html"    data-path="/admin/stores.html">Stores</a></li>
      </ul>
    </nav>

    <!-- Right side: brand filter + view-site + email + log out -->
    <div class="admin-nav__right">
      <!-- Brand filter — scopes every list on every admin page to the chosen brand.
           Persists across pages via localStorage (see /js/brand.js). -->
      <label class="admin-nav__brand-filter" title="Filter admin by brand">
        <span class="admin-nav__brand-filter-label">Brand</span>
        <select data-admin-brand-select>
          <option value="du">Ducks Unlimited</option>
          <option value="rw">Rocwood</option>
          <option value="all">All brands</option>
        </select>
      </label>
      <a class="admin-nav__view-site" href="/" target="_blank" rel="noopener" title="Open live site in a new tab">View site ↗</a>
      <span class="admin-nav__email" data-admin-email></span>
      <button type="button" class="admin-nav__logout" data-admin-logout>Log Out</button>
    </div>

  </div>
</header>

<style>
  /* All selectors scoped to .admin-nav so they can't collide with page styles.

     LAYOUT
       Phone (< 900px):  [ Logo ............ ☰ ]
                         Tapping ☰ opens a panel with the page links, then
                         the brand picker / View site / email / Log out.
       Laptop (≥ 900px): Row 1 [ Logo ...... Brand · View site · email · Log out ]
                         Row 2 [ Dashboard  Orders  Products  …  Stores ]
                         Row 2 stays on ONE line; if a screen is too narrow
                         it scrolls sideways instead of wrapping.            */

  /* The nav's height, so other sticky bars (e.g. the Homepage editor's
     Save / Publish bar) can sit right underneath it: top: var(--admin-nav-h) */
  :root { --admin-nav-h: 56px; }
  @media (min-width: 900px) { :root { --admin-nav-h: 100px; } }

  .admin-nav {
    background: #1B4D2E;          /* brand forest green */
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
    font-family: 'DM Sans', sans-serif;
  }

  .admin-nav__inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 1rem;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "brand  burger"
      "menu   menu"
      "right  right";
    align-items: center;
  }

  /* ── Logo ── */
  .admin-nav__brand {
    grid-area: brand;
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.1;
    text-decoration: none;
    color: #fff;
    padding: 0.7rem 0;             /* keeps the logo off the top edge */
    min-height: 56px;
  }

  .admin-nav__brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .admin-nav__brand-tag {
    font-size: 0.55rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #C9A84C;               /* brand muted gold */
    margin-top: 0.15rem;
  }

  /* ── ☰ button (phone only) — a hidden checkbox does the open/close, no JS ── */
  .admin-nav__toggle {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 0;
    height: 0;
  }

  .admin-nav__hamburger {
    grid-area: burger;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 44px;                  /* big enough to tap */
    height: 44px;
    padding: 13px 9px;
    cursor: pointer;
  }

  .admin-nav__hamburger span {
    display: block;
    height: 2px;
    background: #fff;
    border-radius: 1px;
    transition: transform 0.2s, opacity 0.2s;
  }

  /* The three bars are 8px apart, so moving the outer two by 8px makes an ✕ */
  .admin-nav__toggle:checked ~ .admin-nav__hamburger span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .admin-nav__toggle:checked ~ .admin-nav__hamburger span:nth-child(2) { opacity: 0; }
  .admin-nav__toggle:checked ~ .admin-nav__hamburger span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
  .admin-nav__toggle:focus-visible ~ .admin-nav__hamburger { outline: 2px solid #C9A84C; }

  /* ── Page links ── */
  .admin-nav__menu {
    grid-area: menu;
    display: none;                /* phone: hidden until ☰ is tapped */
  }

  .admin-nav__links {
    list-style: none;
    margin: 0;
    padding: 0.25rem 0 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
    border-top: 1px solid rgba(255,255,255,0.12);
  }

  .admin-nav__links a {
    display: block;
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 0.7rem 0.75rem;      /* finger-sized rows on phones */
    border-radius: 4px;
    white-space: nowrap;
    transition: background-color 0.15s, color 0.15s;
  }

  .admin-nav__links a:hover,
  .admin-nav__links a.is-active {
    background-color: rgba(255,255,255,0.12);
    color: #fff;
  }

  /* ── Brand picker / View site / email / Log out ── */
  .admin-nav__right {
    grid-area: right;
    display: none;                /* phone: hidden until ☰ is tapped */
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    padding: 0.75rem 0 1rem;
    border-top: 1px solid rgba(255,255,255,0.12);
  }

  /* Phone: ☰ open → show the links and the right-hand group */
  .admin-nav__toggle:checked ~ .admin-nav__menu  { display: block; max-height: 70vh; overflow-y: auto; }
  .admin-nav__toggle:checked ~ .admin-nav__right { display: flex; }

  .admin-nav__view-site {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #C9A84C;
    text-decoration: none;
    border: 1px solid rgba(201,168,76,0.4);
    padding: 0.4rem 0.7rem;
    border-radius: 4px;
    white-space: nowrap;
    transition: background-color 0.15s, color 0.15s;
  }

  .admin-nav__view-site:hover {
    background-color: rgba(201,168,76,0.15);
    color: #fff;
  }

  /* Email: phone → its own line on top; laptop → cut short with "…" if long */
  .admin-nav__email {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.65);
    flex-basis: 100%;
    order: -1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .admin-nav__logout {
    background: none;
    border: 1px solid rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.85);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.4rem 0.9rem;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    flex-basis: 100%;             /* phone: a full-width button at the bottom */
    padding: 0.65rem 0.9rem;
    transition: background-color 0.15s, color 0.15s;
  }

  .admin-nav__logout:hover {
    background-color: rgba(255,255,255,0.12);
    color: #fff;
  }

  /* ── Brand picker (admin-wide) ── */
  .admin-nav__brand-filter {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.3rem 0.55rem;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    white-space: nowrap;
  }

  .admin-nav__brand-filter-label {
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }

  .admin-nav__brand-filter select {
    appearance: none;
    background: transparent;
    border: none;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    padding-right: 0.5rem;
    cursor: pointer;
  }

  .admin-nav__brand-filter select option {
    color: #1A1A1A;
  }

  /* ──────────────────────────────────────────────────────────────────────────
     LAPTOP / DESKTOP (≥ 900px) — two tidy rows, no ☰ button.
     ────────────────────────────────────────────────────────────────────────── */
  @media (min-width: 900px) {
    .admin-nav__inner {
      padding: 0 1.5rem;
      grid-template-columns: auto 1fr;
      grid-template-areas:
        "brand  right"
        "menu   menu";
      column-gap: 1.5rem;
    }

    .admin-nav__hamburger { display: none; }

    .admin-nav__right {
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-end;
      gap: 0.75rem;
      padding: 0;
      border-top: none;
      min-width: 0;               /* lets the email shrink instead of wrapping */
    }

    .admin-nav__email {
      flex-basis: auto;
      order: 0;
      min-width: 0;
      max-width: 240px;
    }

    .admin-nav__logout { flex-basis: auto; padding: 0.4rem 0.9rem; }

    .admin-nav__menu {
      display: block;
      /* One line of links; scrolls sideways on a narrow laptop instead of wrapping */
      overflow-x: auto;
      scrollbar-width: none;
    }
    .admin-nav__menu::-webkit-scrollbar { display: none; }

    .admin-nav__links {
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 0.15rem;
      padding: 0;
    }

    .admin-nav__links a {
      font-size: 0.875rem;
      padding: 0.7rem 0.85rem;
      border-radius: 0;
      border-bottom: 2px solid transparent;   /* gold underline marks the current page */
    }

    .admin-nav__links a:hover { background-color: rgba(255,255,255,0.08); }

    .admin-nav__links a.is-active {
      background-color: transparent;
      border-bottom-color: #C9A84C;
    }
  }
</style>

<script type="module">
  // ── Active link highlighting ──────────────────────────────────────────────
  // Mark the link whose data-path matches the current page so the user can
  // always see where they are. Runs once on mount.
  (function highlightActive() {
    const path = window.location.pathname;
    // Treat "/admin/" and "/admin/index.html" as dashboard for highlight purposes
    const normalized =
      path === '/admin/' || path === '/admin/index.html'
        ? '/admin/dashboard.html'
        : path;

    document.querySelectorAll('[data-admin-nav] [data-path]').forEach((link) => {
      if (link.getAttribute('data-path') === normalized) {
        link.classList.add('is-active');
      }
    });
  })();

  // ── Email + logout (uses Supabase session) ────────────────────────────────
  // Imported here so each admin page doesn't have to wire up its own logout.
  import { supabase } from '/lib/supabase.js';

  // Show the signed-in email on the right side of the nav.
  // We do this here (not in each page) so it's consistent everywhere.
  (async function paintEmail() {
    const { data: { session } } = await supabase.auth.getSession();
    const slot = document.querySelector('[data-admin-email]');
    if (slot && session?.user?.email) {
      slot.textContent = session.user.email;
    }
  })();

  // Wire up the log-out button. Sign out, then bounce to the login page.
  document.querySelectorAll('[data-admin-logout]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '/admin/index.html';
    });
  });

  // ── Brand filter: paint current selection and reload on change ───────────
  // Each admin page's data loader reads getAdminBrandSlug() when it queries
  // Supabase, so a reload is the simplest way to refresh the entire list
  // with the newly-selected brand's rows.
  import { getAdminBrandSlug, setAdminBrandSlug } from '/js/brand.js';

  const brandSelect = document.querySelector('[data-admin-brand-select]');
  if (brandSelect) {
    brandSelect.value = getAdminBrandSlug();
    brandSelect.addEventListener('change', () => {
      setAdminBrandSlug(brandSelect.value);
      window.location.reload();
    });
  }
</script>
