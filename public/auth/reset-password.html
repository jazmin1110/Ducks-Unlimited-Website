<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a New Password — Ducks Unlimited</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://qrtfgqscpaghtxnhtoyp.supabase.co" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/account.css" />
  <!-- Browser-tab icon: the Ducks Unlimited duck badge -->
  <link rel="icon" type="image/png" href="/images/brand/du-favicon.png" />
  <link rel="apple-touch-icon" href="/images/brand/du-apple-touch-icon.png" />
</head>
<body>

  <div data-component="nav"></div>

  <main class="auth-shell">
    <div class="auth-card">

      <!-- The link in the reset email signs the customer in for a moment so
           they can set a new password here. -->
      <div id="formView" hidden>
        <p class="eyebrow">Almost done</p>
        <h1>New Password</h1>
        <p class="auth-card__sub">Choose a new password for <strong id="whoEmail"></strong>.</p>

        <form class="auth-form" id="newPwForm" novalidate>
          <div class="auth-error" id="formError" role="alert" hidden></div>

          <div class="field">
            <label class="field-label" for="password">New password</label>
            <div class="password-wrap">
              <input class="input" type="password" id="password" name="password"
                     autocomplete="new-password" required minlength="8" />
              <button type="button" class="password-toggle" data-toggle-password="password"
                      aria-label="Show password">Show</button>
            </div>
            <span class="field-hint">At least 8 characters, with a letter and a number.</span>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Save Password</button>
        </form>
      </div>

      <div id="expiredView" class="auth-sent" hidden>
        <h1>Link expired</h1>
        <p>This reset link has expired or was already used. Request a new one and use it within an hour.</p>
        <p><a class="btn btn-primary" href="/auth/forgot-password.html">Send a New Link</a></p>
      </div>

      <div id="loadingView" class="auth-sent"><p>Checking your link…</p></div>

    </div>
  </main>

  <div data-component="footer"></div>

  <script type="module" src="/js/components.js"></script>
  <script type="module" src="/js/cart.js"></script>

  <script type="module">
    import { supabase } from '/lib/supabase.js';
    import { updatePassword, friendlyAuthError } from '/js/auth.js';

    const views = {
      form:    document.getElementById('formView'),
      expired: document.getElementById('expiredView'),
      loading: document.getElementById('loadingView'),
    };
    function show(name) {
      for (const [k, el] of Object.entries(views)) el.hidden = k !== name;
    }

    // Supabase reads the token from the link automatically and fires
    // PASSWORD_RECOVERY. If the link carried an error (expired), it's in the URL.
    const hash = new URLSearchParams(window.location.hash.slice(1));
    if (hash.get('error') || new URLSearchParams(window.location.search).get('error')) {
      show('expired');
    } else {
      // Give the SDK a moment to exchange the link for a session
      setTimeout(async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { show('expired'); return; }
        document.getElementById('whoEmail').textContent = session.user.email;
        show('form');
      }, 600);
    }

    document.querySelector('[data-toggle-password]').addEventListener('click', (e) => {
      const input = document.getElementById('password');
      const showPw = input.type === 'password';
      input.type = showPw ? 'text' : 'password';
      e.currentTarget.textContent = showPw ? 'Hide' : 'Show';
    });

    const form      = document.getElementById('newPwForm');
    const errorBox  = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.hidden = true;

      const pw = form.password.value;
      if (pw.length < 8 || !/[a-z]/i.test(pw) || !/\d/.test(pw)) {
        errorBox.textContent = 'Please use at least 8 characters, including a letter and a number.';
        errorBox.hidden = false;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving…';

      const { error } = await updatePassword(pw);
      if (error) {
        errorBox.textContent = friendlyAuthError(error);
        errorBox.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Password';
        return;
      }

      window.location.href = '/account/?password=updated';
    });
  </script>

</body>
</html>
