<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Addresses — Ducks Unlimited</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://qrtfgqscpaghtxnhtoyp.supabase.co" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/account.css" />
  <!-- Browser-tab icon: the Ducks Unlimited duck badge -->
  <link rel="icon" type="image/png" href="/images/brand/du-favicon.png" />
  <link rel="apple-touch-icon" href="/images/brand/du-apple-touch-icon.png" />
</head>
<body>

  <div data-component="nav"></div>

  <main class="container account-shell">

    <div id="signedOutView" class="signed-out-gate" hidden
         data-title="Saved addresses"
         data-text="Sign in to save addresses — checkout fills them in for you."></div>

    <div id="signedInView" class="account-layout" hidden>
      <nav class="account-nav" data-account-nav aria-label="Account menu"></nav>

      <section>
        <p class="eyebrow">My Account</p>
        <h1 class="account-title">Addresses</h1>
        <p class="account-subtitle" id="addrSub">Your default address is filled in automatically at checkout.</p>

        <div class="addr-grid" id="addrGrid"></div>

        <!-- Add / edit form (hidden until needed) -->
        <form class="panel" id="addrForm" style="margin-top:var(--space);" hidden novalidate>
          <h2 class="panel__title" id="formTitle" style="margin-bottom:var(--space);">New address</h2>
          <div class="auth-error" id="addrError" role="alert" hidden></div>
          <input type="hidden" id="addrId" />

          <div class="form-grid form-grid--2">
            <div class="field">
              <label class="field-label field-required" for="recipient_name">Full name</label>
              <input class="input" id="recipient_name" name="recipient_name" autocomplete="name" required />
            </div>
            <div class="field">
              <label class="field-label field-required" for="phone">Mobile number</label>
              <input class="input" type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel"
                     placeholder="09XX XXX XXXX" required />
            </div>
            <div class="field span-2">
              <label class="field-label field-required" for="line1">House / unit no., building, street</label>
              <input class="input" id="line1" name="line1" autocomplete="address-line1" required />
            </div>
            <div class="field span-2">
              <label class="field-label" for="line2">Subdivision, village or landmark <span class="text-light" style="text-transform:none; letter-spacing:0;">(optional)</span></label>
              <input class="input" id="line2" name="line2" autocomplete="address-line2"
                     placeholder="e.g. near Greenhills Shopping Center" />
            </div>
            <div class="field">
              <label class="field-label" for="barangay">Barangay</label>
              <input class="input" id="barangay" name="barangay" autocomplete="address-level3" />
            </div>
            <div class="field">
              <label class="field-label field-required" for="city">City / municipality</label>
              <input class="input" id="city" name="city" autocomplete="address-level2" required />
            </div>
            <div class="field">
              <label class="field-label field-required" for="province">Province</label>
              <select class="select" id="province" name="province" autocomplete="address-level1" required></select>
            </div>
            <div class="field">
              <label class="field-label field-required" for="postal_code">ZIP code</label>
              <input class="input" id="postal_code" name="postal_code" autocomplete="postal-code"
                     inputmode="numeric" maxlength="4" required />
            </div>
            <div class="field">
              <label class="field-label" for="label">Label <span class="text-light" style="text-transform:none; letter-spacing:0;">(optional)</span></label>
              <select class="select" id="label" name="label">
                <option value="">—</option>
                <option>Home</option>
                <option>Office</option>
                <option>Other</option>
              </select>
            </div>
          </div>

          <label class="check-row" style="margin-top:var(--space-sm);">
            <input type="checkbox" id="is_default" name="is_default" />
            <span>Use as my default shipping address</span>
          </label>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">Save Address</button>
            <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          </div>
        </form>
      </section>
    </div>

  </main>

  <div data-component="footer"></div>

  <script type="module" src="/js/components.js"></script>
  <script type="module" src="/js/cart.js"></script>
  <script type="module" src="/js/wishlist.js"></script>

  <script type="module">
    import { supabase } from '/lib/supabase.js';
    import { initAccountPage, escapeHtml } from '/js/account.js';
    import { fillProvinceSelect } from '/js/ph-locations.js';

    const PHONE_RE = /^(09\d{9}|\+639\d{9})$/;
    const FIELDS = ['label', 'recipient_name', 'phone', 'line1', 'line2', 'barangay', 'city', 'province', 'postal_code'];

    async function main() {
      const user = await initAccountPage('addresses');
      if (!user) return;

      const grid      = document.getElementById('addrGrid');
      const form      = document.getElementById('addrForm');
      const errorBox  = document.getElementById('addrError');
      const saveBtn   = document.getElementById('saveBtn');
      let addresses   = [];

      function showError(msg) { errorBox.textContent = msg; errorBox.hidden = false; }

      function openForm(a = null) {
        form.reset();
        errorBox.hidden = true;
        document.getElementById('addrId').value = a?.id ?? '';
        document.getElementById('formTitle').textContent = a ? 'Edit address' : 'New address';
        for (const f of FIELDS) if (f !== 'province') form[f].value = a?.[f] ?? '';
        fillProvinceSelect(form.province, a?.province ?? '');
        // First address is always the default
        form.is_default.checked = a ? !!a.is_default : addresses.length === 0;
        form.hidden = false;
        form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        form.recipient_name.focus({ preventScroll: true });
      }
      function closeForm() { form.hidden = true; }

      function render() {
        const cards = addresses.map(a => `
          <div class="addr-card${a.is_default ? ' addr-card--default' : ''}">
            ${a.is_default ? '<span class="addr-card__badge">Default</span>' : ''}
            ${a.label ? `<div class="addr-card__label">${escapeHtml(a.label)}</div>` : ''}
            <div class="addr-card__name">${escapeHtml(a.recipient_name)}</div>
            <div class="addr-card__lines">
              ${escapeHtml(a.line1)}${a.line2 ? '<br />' + escapeHtml(a.line2) : ''}<br />
              ${a.barangay ? escapeHtml(a.barangay) + ', ' : ''}${escapeHtml(a.city)}<br />
              ${escapeHtml(a.province)}${a.postal_code ? ' ' + escapeHtml(a.postal_code) : ''}
            </div>
            <div class="addr-card__phone">${escapeHtml(a.phone)}</div>
            <div class="addr-card__actions">
              <button type="button" class="addr-card__btn" data-edit="${escapeHtml(a.id)}">Edit</button>
              ${!a.is_default ? `<button type="button" class="addr-card__btn" data-default="${escapeHtml(a.id)}">Set as default</button>` : ''}
              <button type="button" class="addr-card__btn addr-card__btn--danger" data-delete="${escapeHtml(a.id)}">Remove</button>
            </div>
          </div>`).join('');

        grid.innerHTML = cards + `<button type="button" class="addr-add" data-add>+ Add a new address</button>`;
      }

      async function load() {
        const { data, error } = await supabase
          .from('customer_addresses').select('*')
          .order('is_default', { ascending: false })
          .order('created_at', { ascending: false });
        if (error) { console.error(error); grid.innerHTML = '<p class="panel__text">Could not load addresses. Please refresh.</p>'; return; }
        addresses = data ?? [];
        render();
      }

      // Only one default is allowed (database rule), so clear the old one first.
      async function clearDefault(exceptId) {
        let q = supabase.from('customer_addresses').update({ is_default: false })
          .eq('user_id', user.id).eq('is_default', true);
        if (exceptId) q = q.neq('id', exceptId);
        return q;
      }

      grid.addEventListener('click', async (e) => {
        if (e.target.closest('[data-add]')) { openForm(); return; }

        const editId = e.target.closest('[data-edit]')?.dataset.edit;
        if (editId) { openForm(addresses.find(a => a.id === editId)); return; }

        const delId = e.target.closest('[data-delete]')?.dataset.delete;
        if (delId) {
          if (!confirm('Remove this address?')) return;
          const removed = addresses.find(a => a.id === delId);
          const { error } = await supabase.from('customer_addresses').delete().eq('id', delId);
          if (error) { alert('Could not remove address.'); return; }
          // If the default was removed, promote the next one so checkout still pre-fills
          const next = addresses.find(a => a.id !== delId);
          if (removed?.is_default && next) {
            await supabase.from('customer_addresses').update({ is_default: true }).eq('id', next.id);
          }
          await load();
          return;
        }

        const defId = e.target.closest('[data-default]')?.dataset.default;
        if (defId) {
          await clearDefault(defId);
          const { error } = await supabase.from('customer_addresses').update({ is_default: true }).eq('id', defId);
          if (error) { alert('Could not update default.'); return; }
          await load();
        }
      });

      document.getElementById('cancelBtn').addEventListener('click', closeForm);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.hidden = true;

        const id = document.getElementById('addrId').value;
        const payload = {
          label:          form.label.value || null,
          recipient_name: form.recipient_name.value.trim(),
          phone:          form.phone.value.replace(/[\s-]/g, ''),
          line1:          form.line1.value.trim(),
          line2:          form.line2.value.trim() || null,
          barangay:       form.barangay.value.trim() || null,
          city:           form.city.value.trim(),
          province:       form.province.value,
          postal_code:    form.postal_code.value.trim(),
          is_default:     form.is_default.checked,
          updated_at:     new Date().toISOString(),
        };

        if (!payload.recipient_name || !payload.line1 || !payload.city || !payload.province) {
          showError('Please fill in all required fields.'); return;
        }
        if (!PHONE_RE.test(payload.phone)) { showError('Please enter a PH mobile number, e.g. 09171234567.'); form.phone.focus(); return; }
        if (!/^\d{4}$/.test(payload.postal_code)) { showError('Please enter a 4-digit ZIP code.'); form.postal_code.focus(); return; }

        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';

        if (payload.is_default) await clearDefault(id || null);

        const { error } = id
          ? await supabase.from('customer_addresses').update(payload).eq('id', id)
          : await supabase.from('customer_addresses').insert({ ...payload, user_id: user.id });

        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Address';

        if (error) { console.error(error); showError('Could not save this address. Please try again.'); return; }
        closeForm();
        await load();
      });

      await load();
      if (new URLSearchParams(location.search).get('new') === '1') openForm();
    }

    main();
  </script>

</body>
</html>
