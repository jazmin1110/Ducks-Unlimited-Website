<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — Ducks Unlimited</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://qrtfgqscpaghtxnhtoyp.supabase.co" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/account.css" />
  <!-- Browser-tab icon: the Ducks Unlimited duck badge -->
  <link rel="icon" type="image/png" href="/images/brand/du-favicon.png" />
  <link rel="apple-touch-icon" href="/images/brand/du-apple-touch-icon.png" />
  <!-- "Add to Home Screen": app name, icon list (Android) and the green phone status bar -->
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="Ducks Unlimited" />
  <meta name="theme-color" content="#1B4D2E" />
</head>
<body>

  <div data-component="nav"></div>

  <main class="container account-shell">

    <!-- Filled in by initAccountPage() when nobody is signed in -->
    <div id="signedOutView" class="signed-out-gate" hidden></div>

    <div id="signedInView" class="account-layout" hidden>
      <nav class="account-nav" data-account-nav aria-label="Account menu"></nav>

      <section>
        <p class="eyebrow">My Account</p>
        <h1 class="account-title" id="greeting">Welcome back</h1>
        <p class="account-subtitle" id="emailLine"></p>

        <div class="auth-success" id="flash" hidden></div>

        <!-- Quick counts — each one is a link -->
        <div class="stat-row">
          <a class="stat" href="/account/orders.html"><span class="stat__num" id="statOrders">–</span><span class="stat__label">Orders</span></a>
          <a class="stat" href="/account/wishlist.html"><span class="stat__num" id="statWishlist">–</span><span class="stat__label">Wishlist</span></a>
          <a class="stat" href="/account/addresses.html"><span class="stat__num" id="statAddresses">–</span><span class="stat__label">Addresses</span></a>
        </div>

        <!-- Most recent order with live status — the #1 reason people log in -->
        <div class="panel" id="latestPanel">
          <div class="panel__head">
            <h2 class="panel__title">Latest order</h2>
            <a class="panel__link" href="/account/orders.html">All orders</a>
          </div>
          <div id="latestOrder"><p class="panel__text">Loading…</p></div>
        </div>

        <!-- Default address + profile gaps -->
        <div class="panel">
          <div class="panel__head">
            <h2 class="panel__title">Shipping to</h2>
            <a class="panel__link" href="/account/addresses.html">Manage</a>
          </div>
          <div id="defaultAddress"><p class="panel__text">Loading…</p></div>
        </div>

        <div class="panel" id="completePanel" hidden>
          <div class="panel__head">
            <h2 class="panel__title">Finish your profile</h2>
          </div>
          <p class="panel__text" id="completeText"></p>
          <a class="btn btn-outline-dark btn-sm" href="/account/profile.html">Add Details</a>
        </div>
      </section>
    </div>

  </main>

  <div data-component="footer"></div>

  <script type="module" src="/js/components.js"></script>
  <script type="module" src="/js/cart.js"></script>
  <script type="module" src="/js/wishlist.js"></script>

  <script type="module">
    import { supabase } from '/lib/supabase.js';
    import {
      initAccountPage, escapeHtml, formatPrice, formatDate,
      orderFromRow, orderStatus, ORDER_SELECT,
    } from '/js/account.js';

    // Wrapped in a function so we can `return` early (a bare `return` at the
    // top of a module script is a syntax error and breaks the whole page).
    async function main() {
      const user = await initAccountPage('overview');
      if (!user) return;

      document.getElementById('emailLine').textContent = user.email;

      // One-off message after a password reset
      if (new URLSearchParams(location.search).get('password') === 'updated') {
        const flash = document.getElementById('flash');
        flash.textContent = 'Your password has been updated.';
        flash.hidden = false;
      }

      // Load everything at once (in parallel) so the page fills in quickly
      const [profileRes, ordersRes, wishRes, addrRes] = await Promise.all([
        supabase.from('customer_profiles').select('display_name, phone, birthday').eq('id', user.id).maybeSingle(),
        supabase.from('orders').select(ORDER_SELECT, { count: 'exact' }).order('created_at', { ascending: false }).limit(1),
        supabase.from('wishlists').select('id', { count: 'exact', head: true }),
        supabase.from('customer_addresses').select('*').order('is_default', { ascending: false }),
      ]);

      // ── Greeting ──
      const profile = profileRes.data || {};
      const name = profile.display_name || user.user_metadata?.display_name;
      document.getElementById('greeting').textContent = name ? `Hi, ${name.split(' ')[0]}` : 'Welcome back';

      // ── Counts ──
      document.getElementById('statOrders').textContent    = ordersRes.count ?? 0;
      document.getElementById('statWishlist').textContent  = wishRes.count ?? 0;
      document.getElementById('statAddresses').textContent = addrRes.data?.length ?? 0;

      // ── Latest order ──
      const latestEl = document.getElementById('latestOrder');
      const row = ordersRes.data?.[0];
      if (ordersRes.error) {
        latestEl.innerHTML = '<p class="panel__text">Could not load your orders. Please refresh.</p>';
      } else if (!row) {
        latestEl.innerHTML = `
          <p class="panel__text">No orders yet. When you place one, you'll be able to track it here.</p>
          <a class="btn btn-primary btn-sm" href="/shop.html">Start Shopping</a>
          <p class="panel__text" style="margin-top:var(--space);">
            Ordered as a guest before? <a href="/track-order.html">Find it and add it to your account</a>.
          </p>`;
      } else {
        const o = orderFromRow(row);
        const s = orderStatus(o);
        const thumbs = o.items.slice(0, 4).map(it =>
          `<span>${it.image ? `<img src="${escapeHtml(it.image)}" alt="" loading="lazy" />` : ''}</span>`).join('');
        latestEl.innerHTML = `
          <a class="order-card" href="/account/order.html?id=${encodeURIComponent(o.id)}" style="margin:0;">
            <div class="order-card__top">
              <div>
                <div class="order-card__num">#${escapeHtml(o.orderNumber)}</div>
                <div class="order-card__date">Placed ${escapeHtml(formatDate(o.createdAt))}</div>
              </div>
              <span class="order-status order-status--${s.key}">${escapeHtml(s.label)}</span>
            </div>
            <div class="order-card__thumbs">${thumbs}</div>
            <div class="order-card__bottom">
              <span>${o.items.length} ${o.items.length === 1 ? 'item' : 'items'} · <strong>${formatPrice(o.total)}</strong></span>
              <span class="order-card__cta">Track →</span>
            </div>
          </a>`;
      }

      // ── Default address ──
      const addrEl = document.getElementById('defaultAddress');
      const a = addrRes.data?.[0];
      if (!a) {
        addrEl.innerHTML = `
          <p class="panel__text">No saved address yet. Add one and checkout fills it in for you.</p>
          <a class="btn btn-outline-dark btn-sm" href="/account/addresses.html?new=1">Add Address</a>`;
      } else {
        addrEl.innerHTML = `
          <p class="panel__text" style="color:var(--color-text); margin:0;">
            <strong style="font-weight:500;">${escapeHtml(a.recipient_name)}</strong><br />
            ${escapeHtml(a.line1)}${a.line2 ? ', ' + escapeHtml(a.line2) : ''}<br />
            ${a.barangay ? escapeHtml(a.barangay) + ', ' : ''}${escapeHtml(a.city)}, ${escapeHtml(a.province)} ${escapeHtml(a.postal_code || '')}<br />
            <span style="color:var(--color-text-muted);">${escapeHtml(a.phone)}</span>
          </p>`;
      }

      // ── Nudge to fill missing profile details (not required, just helpful) ──
      const missing = [];
      if (!profile.phone)    missing.push('mobile number');
      if (!profile.birthday) missing.push('birthday');
      if (missing.length) {
        document.getElementById('completeText').textContent = `Add your ${missing.join(' and ')}.`;
        document.getElementById('completePanel').hidden = false;
      }
    }

    main();
  </script>

</body>
</html>
