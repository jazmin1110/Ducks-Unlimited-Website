<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders &amp; Tracking — Ducks Unlimited</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://qrtfgqscpaghtxnhtoyp.supabase.co" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/account.css" />
  <!-- Browser-tab icon: the Ducks Unlimited duck badge -->
  <link rel="icon" type="image/png" href="/images/brand/du-favicon.png" />
  <link rel="apple-touch-icon" href="/images/brand/du-apple-touch-icon.png" />
</head>
<body>

  <div data-component="nav"></div>

  <main class="container account-shell">

    <div id="signedOutView" class="signed-out-gate" hidden
         data-title="Your orders"
         data-text="Sign in to see your orders and track deliveries."></div>

    <div id="signedInView" class="account-layout" hidden>
      <nav class="account-nav" data-account-nav aria-label="Account menu"></nav>

      <section>
        <p class="eyebrow">My Account</p>
        <h1 class="account-title">Orders &amp; Tracking</h1>
        <p class="account-subtitle" id="ordersSub">Loading…</p>

        <div id="ordersList"></div>

        <!-- Guest orders placed with another email, or before signing up -->
        <div class="panel" style="margin-top:var(--space-lg);">
          <h2 class="panel__title" style="margin-bottom:0.4rem;">Missing an order?</h2>
          <p class="panel__text">
            Orders placed as a guest don't show up here automatically.
            Find one with its order number and email, then add it to your account.
          </p>
          <a class="btn btn-outline-dark btn-sm" href="/track-order.html">Find an Order</a>
        </div>
      </section>
    </div>

  </main>

  <div data-component="footer"></div>

  <script type="module" src="/js/components.js"></script>
  <script type="module" src="/js/cart.js"></script>
  <script type="module" src="/js/wishlist.js"></script>

  <script type="module">
    import { supabase } from '/lib/supabase.js';
    import {
      initAccountPage, escapeHtml, formatPrice, formatDate,
      orderFromRow, orderStatus, ORDER_SELECT,
    } from '/js/account.js';

    async function main() {
      const user = await initAccountPage('orders');
      if (!user) return;

      const list = document.getElementById('ordersList');
      const sub  = document.getElementById('ordersSub');

      // RLS only returns orders where orders.user_id = this customer
      const { data, error } = await supabase
        .from('orders')
        .select(ORDER_SELECT)
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        sub.textContent = '';
        list.innerHTML = '<p class="panel__text">Could not load your orders. Please refresh the page.</p>';
        return;
      }

      if (!data.length) {
        sub.textContent = '';
        list.innerHTML = `
          <div class="panel empty-state">
            <h2>No orders yet</h2>
            <p>When you place an order, you'll see it here with live tracking.</p>
            <a href="/shop.html" class="btn btn-primary">Start Shopping</a>
          </div>`;
        return;
      }

      const orders = data.map(orderFromRow);

      // Orders still on the way go first so they're easy to find
      const active = orders.filter(o => o.paymentStatus === 'paid' && o.fulfillmentStatus !== 'delivered');
      sub.textContent = `${orders.length} ${orders.length === 1 ? 'order' : 'orders'}` +
        (active.length ? ` · ${active.length} on the way` : '');

      list.innerHTML = orders.map(o => {
        const s = orderStatus(o);
        const thumbs = o.items.slice(0, 4).map(it =>
          `<span>${it.image ? `<img src="${escapeHtml(it.image)}" alt="" loading="lazy" />` : ''}</span>`).join('')
          + (o.items.length > 4 ? `<span>+${o.items.length - 4}</span>` : '');
        return `
          <a class="order-card" href="/account/order.html?id=${encodeURIComponent(o.id)}">
            <div class="order-card__top">
              <div>
                <div class="order-card__num">#${escapeHtml(o.orderNumber)}</div>
                <div class="order-card__date">Placed ${escapeHtml(formatDate(o.createdAt))}</div>
              </div>
              <span class="order-status order-status--${s.key}">${escapeHtml(s.label)}</span>
            </div>
            <div class="order-card__thumbs">${thumbs}</div>
            <div class="order-card__bottom">
              <span>${o.items.length} ${o.items.length === 1 ? 'item' : 'items'} · <strong>${formatPrice(o.total)}</strong></span>
              <span class="order-card__cta">${s.key === 'shipped' ? 'Track' : 'Details'} →</span>
            </div>
          </a>`;
      }).join('');
    }

    main();
  </script>

</body>
</html>
