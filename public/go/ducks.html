<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Front-store QR landing page: keep it out of Google, it's not part of the shop -->
  <meta name="robots" content="noindex, nofollow">
  <title>Ducks Unlimited - Follow Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Mobile-first: this page is only ever opened on a phone after scanning the QR */
    body { margin: 0; padding: 56px 20px; text-align: center; background: #F5F0E8; color: #1B4D2E;
           font-family: 'DM Sans', -apple-system, 'Segoe UI', sans-serif; }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 44px; font-weight: 600; margin: 0 0 8px; }
    p  { margin: 0 0 32px; opacity: .8; }
    a.btn { display: block; max-width: 320px; margin: 14px auto; padding: 18px; border-radius: 12px;
            color: #fff; text-decoration: none; font-size: 18px; font-weight: 700; }
    .fb { background: #1877f2; }
    .ig { background: #e1306c; }
  </style>
  <!-- Vercel Web Analytics (counts scans per store path). Harmless if analytics is off. -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <h1>Ducks Unlimited</h1>
  <p>Follow us for new drops and sale alerts!</p>
  <a class="btn fb" href="https://www.facebook.com/DucksUnlimitedPh/">Follow on Facebook</a>
  <a class="btn ig" href="https://www.instagram.com/ducks.ph/">Follow on Instagram</a>
</body>
</html>
